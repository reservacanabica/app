<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotes e Certificados de Análise</title>
  
  <link rel="stylesheet" href="quality-components.css">
</head>
<body>
  <div class="list-container">
    <!-- Header -->
    <div class="page-header">
      <div class="page-header-content">
        <div class="page-header-title">
          <i class="material-icons">science</i>
          <h2>Lotes e Certificados de Análise (CoA)</h2>
        </div>
      </div>
      <div class="page-header-actions">
        <button onclick="navigateTo('lote-form')" class="button">
          <i class="material-icons">add</i>
          <span>Novo CoA</span>
        </button>
      </div>
    </div>
    
    <!-- Filters -->
    <div class="page-filters">
      <div class="search-box">
        <i class="material-icons">search</i>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Buscar por lote, insumo, laboratório..."
        >
      </div>
      
      <select id="filterStatusAuditoria" class="filter-select">
        <option value="">Todos (Auditoria)</option>
        <option value="PENDENTE">Pendente</option>
        <option value="APROVADO">Aprovado</option>
        <option value="ALERTA">Alerta</option>
        <option value="REPROVADO">Reprovado</option>
        <option value="BLOQUEADO">Bloqueado</option>
      </select>
      
      <select id="filterStatusLiberacao" class="filter-select">
        <option value="">Todos (Liberação)</option>
        <option value="PENDENTE">Pendente</option>
        <option value="LIBERADO">Liberado</option>
        <option value="QUARENTENA">Quarentena</option>
        <option value="BLOQUEADO">Bloqueado</option>
      </select>
      
      <button onclick="applyFilters()" class="button button-secondary">
        <i class="material-icons">filter_list</i>
        <span>Filtrar</span>
      </button>
    </div>
    
    <!-- Table -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('numero_lote')" style="cursor: pointer;">
              Nº Lote ↕
            </th>
            <th onclick="sortTable('insumo_nome')" style="cursor: pointer;">
              Insumo ↕
            </th>
            <th onclick="sortTable('data_fabricacao')" style="cursor: pointer;">
              Fabricação ↕
            </th>
            <th onclick="sortTable('data_validade')" style="cursor: pointer;">
              Validade ↕
            </th>
            <th>
              Metais (ppm)
            </th>
            <th onclick="sortTable('status_auditoria')" style="cursor: pointer;">
              Auditoria ↕
            </th>
            <th onclick="sortTable('status_liberacao')" style="cursor: pointer;">
              Liberação ↕
            </th>
            <th style="text-align: center;">
              Ações
            </th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Populated via JS -->
        </tbody>
      </table>
    </div>
    
    <!-- Empty state -->
    <div id="emptyState" class="empty-state" hidden>
      <p>Nenhum lote encontrado</p>
      <button onclick="navigateTo('lote-form')" class="btn-primary" style="margin-top: 1rem;">
        Cadastrar Primeiro Lote
      </button>
    </div>
    
    <!-- Stats -->
    <div id="stats" style="margin-top: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
      <div style="padding: 1rem; background: var(--bg-secondary); border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase; margin-bottom: 0.5rem;">Total</div>
        <div style="font-size: 1.5rem; font-weight: 700;" id="totalCount">0</div>
      </div>
      
      <div style="padding: 1rem; background: #d1fae5; border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #065f46; text-transform: uppercase; margin-bottom: 0.5rem;">Liberados</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #065f46;" id="liberadosCount">0</div>
      </div>
      
      <div style="padding: 1rem; background: #fef3c7; border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #92400e; text-transform: uppercase; margin-bottom: 0.5rem;">Quarentena</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #92400e;" id="quarentenaCount">0</div>
      </div>
      
      <div style="padding: 1rem; background: #fee2e2; border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #991b1b; text-transform: uppercase; margin-bottom: 0.5rem;">Bloqueados</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #991b1b;" id="bloqueadosCount">0</div>
      </div>
      
      <div style="padding: 1rem; background: #fef3c7; border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #92400e; text-transform: uppercase; margin-bottom: 0.5rem;">Vencimento Próximo</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #92400e;" id="vencimentoCount">0</div>
      </div>
    </div>
  </div>
  
  <script src="quality-helpers.js"></script>
  <script src="api-client.html"></script>
  
  <script>
    // Estado
    let allLotes = [];
    let filteredLotes = [];
    let insumos = {}; // Cache de insumos por ID
    let currentSort = { field: 'data_validade', direction: 'asc' };
    
    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      
      // Event listeners
      document.getElementById('searchInput').addEventListener('input', applyFilters);
    });
    
    /**
     * Carrega dados (lotes + insumos)
     */
    async function loadData() {
      try {
        showLoading(true);
        
        // Carregar em paralelo
        const [lotesData, insumosData] = await Promise.all([
          api.lotes.list(),
          api.insumos.list()
        ]);
        
        // Criar cache de insumos
        insumosData.forEach(insumo => {
          insumos[insumo.id] = insumo;
        });
        
        // Enriquecer lotes com nome do insumo
        allLotes = lotesData.map(lote => ({
          ...lote,
          insumo_nome: insumos[lote.insumo_id]?.nome_comercial || 'Insumo não encontrado'
        }));
        
        filteredLotes = allLotes;
        
        applyFilters();
        
      } catch (error) {
        handleApiError(error);
      } finally {
        showLoading(false);
      }
    }
    
    /**
     * Aplica filtros
     */
    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value;
      const filterStatusAuditoria = document.getElementById('filterStatusAuditoria').value;
      const filterStatusLiberacao = document.getElementById('filterStatusLiberacao').value;
      
      let result = allLotes;
      
      // Filtro de busca
      if (searchTerm) {
        result = filterItems(result, searchTerm, [
          'numero_lote',
          'insumo_nome',
          'laboratorio_emissor'
        ]);
      }
      
      // Filtro de status auditoria
      if (filterStatusAuditoria) {
        result = result.filter(l => l.status_auditoria === filterStatusAuditoria);
      }
      
      // Filtro de status liberação
      if (filterStatusLiberacao) {
        result = result.filter(l => l.status_liberacao === filterStatusLiberacao);
      }
      
      filteredLotes = result;
      
      // Aplicar ordenação
      filteredLotes = sortBy(filteredLotes, currentSort.field, currentSort.direction);
      
      renderTable();
      updateStats();
    }
    
    /**
     * Ordena tabela
     */
    function sortTable(field) {
      if (currentSort.field === field) {
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.field = field;
        currentSort.direction = 'asc';
      }
      
      filteredLotes = sortBy(filteredLotes, currentSort.field, currentSort.direction);
      renderTable();
    }
    
    /**
     * Renderiza tabela
     */
    function renderTable() {
      const columns = [
        {
          key: 'numero_lote',
          render: (value) => `<strong>${value}</strong>`
        },
        {
          key: 'insumo_nome',
          render: (value, item) => {
            return `<div style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${value}">${value}</div>`;
          }
        },
        {
          key: 'data_fabricacao',
          render: (value) => formatDate(value)
        },
        {
          key: 'data_validade',
          render: (value, item) => {
            const validade = new Date(value);
            const hoje = new Date();
            const diasRestantes = Math.ceil((validade - hoje) / (1000 * 60 * 60 * 24));
            
            let color = '#10b981'; // verde
            if (diasRestantes < 30) color = '#f59e0b'; // amarelo
            if (diasRestantes < 0) color = '#ef4444'; // vermelho
            
            return `<span style="color: ${color}; font-weight: 500;">${formatDate(value)}</span>`;
          }
        },
        {
          key: 'metais',
          render: (_, item) => {
            const metais = [
              { label: 'Pb', valor: item.teor_pb_ppm, limite: 2.0 },
              { label: 'Cd', valor: item.teor_cd_ppm, limite: 0.5 },
              { label: 'As', valor: item.teor_as_ppm, limite: 1.0 },
              { label: 'Hg', valor: item.teor_hg_ppm, limite: 0.1 }
            ];
            
            const alertas = metais.filter(m => m.valor > m.limite);
            
            if (alertas.length > 0) {
              return `<span style="color: #ef4444; font-weight: 500;" title="${alertas.map(a => `${a.label}: ${a.valor}`).join(', ')}">⚠️ ${alertas.length} alerta(s)</span>`;
            }
            
            return '<span style="color: #10b981;">✓ OK</span>';
          }
        },
        {
          key: 'status_auditoria',
          render: (value) => getStatusBadge(value)
        },
        {
          key: 'status_liberacao',
          render: (value) => getStatusBadge(value)
        }
      ];
      
      const actionsRenderer = (item) => {
        const canApprove = item.status_auditoria === 'PENDENTE';
        
        return `
          <div style="display: flex; gap: 0.5rem; justify-content: center;">
            <button onclick="viewLote('${item.id}')" class="btn-sm btn-secondary" title="Visualizar">
              👁️
            </button>
            <button onclick="editLote('${item.id}')" class="btn-sm btn-primary" title="Editar">
              ✏️
            </button>
            ${canApprove ? `
              <button onclick="approveLote('${item.id}', '${item.numero_lote}')" class="btn-sm btn-success" title="Aprovar">
                ✓
              </button>
            ` : ''}
            <button onclick="deleteLote('${item.id}', '${item.numero_lote}')" class="btn-sm btn-danger" title="Excluir">
              🗑️
            </button>
          </div>
        `;
      };
      
      window.renderTable(filteredLotes, columns, actionsRenderer);
    }
    
    /**
     * Atualiza estatísticas
     */
    function updateStats() {
      const total = filteredLotes.length;
      const liberados = filteredLotes.filter(l => l.status_liberacao === 'LIBERADO').length;
      const quarentena = filteredLotes.filter(l => l.status_liberacao === 'QUARENTENA').length;
      const bloqueados = filteredLotes.filter(l => l.status_liberacao === 'BLOQUEADO').length;
      
      // Calcular vencimento próximo (< 30 dias)
      const hoje = new Date();
      const vencimentoProximo = filteredLotes.filter(l => {
        const validade = new Date(l.data_validade);
        const diasRestantes = Math.ceil((validade - hoje) / (1000 * 60 * 60 * 24));
        return diasRestantes > 0 && diasRestantes < 30;
      }).length;
      
      document.getElementById('totalCount').textContent = total;
      document.getElementById('liberadosCount').textContent = liberados;
      document.getElementById('quarentenaCount').textContent = quarentena;
      document.getElementById('bloqueadosCount').textContent = bloqueados;
      document.getElementById('vencimentoCount').textContent = vencimentoProximo;
      
      document.getElementById('emptyState').hidden = total > 0;
    }
    
    /**
     * Visualiza lote
     */
    function viewLote(id) {
      navigateTo('lote-view', { id });
    }
    
    /**
     * Edita lote
     */
    function editLote(id) {
      navigateTo('lote-form', { id });
    }
    
    /**
     * Aprova lote (workflow simplificado inline)
     */
    async function approveLote(id, numero) {
      const confirmed = confirm(
        `Aprovar lote "${numero}"?\n\n` +
        `Isso mudará o status de auditoria para APROVADO e o status de liberação para LIBERADO.`
      );
      
      if (!confirmed) return;
      
      try {
        showLoading(true);
        
        // Usar service de aprovação (quando implementado) ou update direto
        await api.lotes.update(id, {
          status_auditoria: 'APROVADO',
          status_liberacao: 'LIBERADO',
          data_auditoria: new Date().toISOString(),
          auditor_email: 'usuario@sistema.com' // TODO: Obter do contexto de autenticação
        });
        
        showToast('success', 'Lote aprovado com sucesso!');
        
        await loadData();
        
      } catch (error) {
        handleApiError(error);
      } finally {
        showLoading(false);
      }
    }
    
    /**
     * Exclui lote
     */
    async function deleteLote(id, numero) {
      const confirmed = confirm(
        `Tem certeza que deseja excluir o lote "${numero}"?\n\n` +
        `Esta ação não pode ser desfeita.`
      );
      
      if (!confirmed) return;
      
      try {
        showLoading(true);
        
        await api.lotes.delete(id);
        
        showToast('success', 'Lote excluído com sucesso!');
        
        await loadData();
        
      } catch (error) {
        handleApiError(error);
      } finally {
        showLoading(false);
      }
    }
  </script>
</body>
</html>
