<style>
/* BRIDGE: aliases legado → design system tokens
   Mantém compatibilidade com layout.html/sidebar.html
   que ainda usam --spacing-*, --primary, etc.           */
:root {
  --spacing-xs:  var(--space-xs,  4px);
  --spacing-sm:  var(--space-sm,  8px);
  --spacing-md:  var(--space-md,  16px);
  --spacing-lg:  var(--space-lg,  24px);
  --spacing-xl:  var(--space-xl,  32px);
  --primary:          var(--color-primary,       #4CAF50);
  --primary-dark:     var(--color-primary-dark,  #1b5e20);
  --text-primary:     var(--color-text-primary,  #212121);
  --text-secondary:   var(--color-text-secondary,#757575);
  --bg-secondary:     var(--color-bg-hover,      #f5f5f5);
  --border-radius:    var(--radius-md,  8px);
  --shadow-sm:        var(--shadow-sm,  0 1px 2px rgba(0,0,0,.05));
  --shadow-md:        var(--shadow-md,  0 4px 6px rgba(0,0,0,.1));
  --shadow-lg:        var(--shadow-lg,  0 10px 15px rgba(0,0,0,.1));
  --transition:       var(--transition-base, 200ms cubic-bezier(.4,0,.2,1));
}

/* DASHBOARD PAGE */
.dashboard-page {
  padding: 0;
}

/* PAGE HEADER */
.page-header {
  padding: var(--space-xl, var(--canna-space-8));
  background: linear-gradient(135deg, var(--color-primary, #4CAF50) 0%, #229954 100%);
  color: white;
  margin-bottom: var(--space-lg, var(--canna-space-6));
}

.page-header-content {
  max-width: 1200px;
}

.page-header-title {
  display: flex;
  align-items: center;
  gap: var(--space-sm, var(--canna-space-2));
  margin-bottom: var(--space-xs, var(--canna-space-1));
}

.page-header-title .material-icons {
  font-size: 2rem;
}

.page-header-title h2 {
  margin: 0;
  font-size: var(--font-size-3xl, 2rem);
  font-weight: var(--font-weight-bold, 700);
  line-height: var(--line-height-tight, 1.25);
}

.page-header-subtitle {
  margin: 0;
  opacity: 0.9;
  font-size: var(--font-size-base, 1rem);
}

/* METRICS GRID */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-lg, var(--canna-space-6));
  padding: 0 var(--space-lg, var(--canna-space-6));
  margin-bottom: var(--space-lg, var(--canna-space-6));
}

/* Metric cards usam o .card base + modificadores de cor */
.metric-card {
  background: white;
  border-radius: var(--radius-lg, var(--canna-space-3));
  padding: var(--space-lg, var(--canna-space-6));
  box-shadow: var(--shadow-md);
  border-left: 4px solid var(--color-primary, #4CAF50);
  transition: all var(--transition-base, 200ms);
}

.metric-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

.metric-card.warning { border-left-color: var(--color-warning, #ff9800); }
.metric-card.danger  { border-left-color: var(--color-error,   #f44336); }
.metric-card.success { border-left-color: var(--color-success, #4caf50); }
.metric-card.info    { border-left-color: var(--color-info,    #2196f3); }

.metric-label {
  font-size: var(--font-size-sm, .875rem);
  color: var(--color-text-secondary, #757575);
  margin-bottom: var(--space-sm, var(--canna-space-2));
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: var(--font-weight-semibold, 600);
}

.metric-value {
  font-size: 2.5rem;
  font-weight: var(--font-weight-bold, 700);
  color: var(--color-primary, #4CAF50);
  margin-bottom: var(--space-sm, var(--canna-space-2));
}

.metric-card.warning .metric-value { color: var(--color-warning, #ff9800); }
.metric-card.danger  .metric-value { color: var(--color-error,   #f44336); }
.metric-card.success .metric-value { color: var(--color-success, #4caf50); }
.metric-card.info    .metric-value { color: var(--color-info,    #2196f3); }

.metric-change {
  font-size: var(--font-size-sm, .875rem);
  color: var(--color-text-secondary, #757575);
}

.metric-change.positive { color: var(--color-success, #4caf50); }
.metric-change.negative { color: var(--color-error,   #f44336); }

/* CHARTS SECTION */
.charts-section {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: var(--space-lg, var(--canna-space-6));
  padding: 0 var(--space-lg, var(--canna-space-6));
  margin-bottom: var(--space-lg, var(--canna-space-6));
}

/* RECENT LIST */
.recent-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-md, var(--canna-space-4));
}

.recent-item {
  padding: var(--space-md, var(--canna-space-4));
  background-color: var(--color-bg-hover, #f5f5f5);
  border-radius: var(--radius-md, var(--canna-space-2));
  border-left: 3px solid var(--color-primary, #4CAF50);
}

.recent-item-title {
  font-weight: var(--font-weight-semibold, 600);
  color: var(--color-text-primary, #212121);
  margin-bottom: var(--space-xs, var(--canna-space-1));
}

.recent-item-meta {
  font-size: var(--font-size-sm, .875rem);
  color: var(--color-text-secondary, #757575);
}

.recent-item-badge {
  display: inline-block;
  padding: 4px var(--space-sm, var(--canna-space-2));
  background-color: var(--color-primary, #4CAF50);
  color: white;
  border-radius: var(--radius-sm, 4px);
  font-size: var(--font-size-xs, .75rem);
  margin-top: var(--space-xs, var(--canna-space-1));
}

/* ACTIVITY TIMELINE */
.activity-section {
  padding: 0 var(--space-lg, var(--canna-space-6));
  margin-bottom: var(--space-lg, var(--canna-space-6));
}

.timeline {
  display: flex;
  flex-direction: column;
  gap: var(--space-md, var(--canna-space-4));
}

.timeline-item {
  display: flex;
  gap: var(--space-md, var(--canna-space-4));
  padding: var(--space-md, var(--canna-space-4));
  background: white;
  border-radius: var(--radius-md, var(--canna-space-2));
  border: 1px solid var(--color-border, #e0e0e0);
}

.timeline-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background-color: var(--color-primary, #4CAF50);
  margin-top: 6px;
  flex-shrink: 0;
}

.timeline-content { flex: 1; }

.timeline-title {
  font-weight: var(--font-weight-semibold, 600);
  color: var(--color-text-primary, #212121);
  margin-bottom: var(--space-xs, var(--canna-space-1));
}

.timeline-description {
  font-size: var(--font-size-sm, .875rem);
  color: var(--color-text-secondary, #757575);
  margin-bottom: var(--space-xs, var(--canna-space-1));
}

.timeline-time {
  font-size: var(--font-size-sm, .875rem);
  color: var(--color-text-secondary, #757575);
  font-style: italic;
}

/* QUICK ACTIONS */
.quick-actions {
  display: flex;
  gap: var(--space-md, var(--canna-space-4));
  padding: 0 var(--space-lg, var(--canna-space-6)) var(--space-lg, var(--canna-space-6));
  flex-wrap: wrap;
}

.card-title {
  display: flex;
  align-items: center;
  gap: var(--space-sm, var(--canna-space-2));
}

.card-title .material-icons {
  font-size: 20px;
  color: var(--color-primary, #4CAF50);
}

.quick-actions .button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm, var(--canna-space-2));
  flex: 1;
  min-width: 150px;
}

.quick-actions .button .material-icons {
  font-size: 18px;
}

/* RESPONSIVO */
@media (max-width: 768px) {
  .metrics-grid,
  .charts-section {
    grid-template-columns: 1fr;
    padding: 0 var(--space-md, var(--canna-space-4));
  }

  .quick-actions {
    flex-direction: column;
    padding: 0 var(--space-md, var(--canna-space-4)) var(--space-lg, var(--canna-space-6));
  }

  .quick-actions .button {
    width: 100%;
  }

  .page-header {
    padding: var(--space-lg, var(--canna-space-6));
  }

  .page-header-title h2 {
    font-size: var(--font-size-2xl, 1.5rem);
  }
}
</style>

<script>
<?!= include("api-client.html"); ?>

class DashboardPage {
  constructor() {
    this.loadingState   = document.getElementById('loading-state');
    this.errorState     = document.getElementById('error-state');
    this.errorMessage   = document.getElementById('error-message');
    this.metricsGrid    = document.getElementById('metrics-grid');
    this.chartsSection  = document.getElementById('charts-section');
    this.activitySection= document.getElementById('activity-section');

    this.initialize();
  }

  async initialize() {
    try {
      this.showLoading();

      const data = await api.get('/dashboard');
      if (!data) throw new Error('Dados de dashboard inválidos');

      this.renderMetrics(data.metrics);
      this.renderCharts(data);
      this.renderActivity(data.recentActivity);

      this.hideLoading();
      this.showContent();

    } catch (error) {
      console.error('Dashboard error:', error);
      this.showError(error.message || 'Erro ao carregar dashboard');
      this.hideLoading();
    }
  }

  renderMetrics(metrics) {
    if (!metrics || metrics.length === 0) return;

    this.metricsGrid.innerHTML = metrics.map(metric => {
      const changeClass  = metric.change > 0 ? 'positive' : metric.change < 0 ? 'negative' : '';
      const changeSymbol = metric.change > 0 ? '↑' : metric.change < 0 ? '↓' : '→';

      return `
        <div class="metric-card ${metric.type || ''}">
          <div class="metric-label">${metric.label}</div>
          <div class="metric-value">${metric.value}</div>
          ${metric.change !== undefined ? `
            <div class="metric-change ${changeClass}">
              ${changeSymbol} ${Math.abs(metric.change)}% vs último mês
            </div>` : ''}
        </div>`;
    }).join('');
  }

  renderCharts(data) {
    if (!data.studiesByStatus) return;
    this.renderStudiesChart(data.studiesByStatus);
    if (data.recentExperiments) this.renderRecentExperiments(data.recentExperiments);
  }

  renderStudiesChart(studiesByStatus) {
    const container = document.getElementById('studies-chart-container');
    container.innerHTML = Object.entries(studiesByStatus).map(([status, count]) => `
      <div class="recent-item">
        <div class="recent-item-title">${status}</div>
        <div class="recent-item-meta"><strong>${count}</strong> estudo(s)</div>
      </div>`).join('');
  }

  renderRecentExperiments(experiments) {
    document.getElementById('recent-experiments').innerHTML =
      experiments.slice(0, 5).map(exp => `
        <div class="recent-item">
          <div class="recent-item-title">${exp.name}</div>
          <div class="recent-item-meta">${exp.studyName} • ${exp.date}</div>
          <span class="recent-item-badge">${exp.status}</span>
        </div>`).join('');
  }

  renderActivity(activity) {
    if (!activity || activity.length === 0) return;

    document.getElementById('activity-timeline').innerHTML =
      activity.slice(0, 8).map(item => `
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-content">
            <div class="timeline-title">${item.action}</div>
            <div class="timeline-description">${item.description}</div>
            <div class="timeline-time">${item.timestamp}</div>
          </div>
        </div>`).join('');
  }

  showLoading() {
    this.loadingState.style.display  = 'block';
    this.metricsGrid.style.display   = 'none';
    this.chartsSection.style.display = 'none';
    this.activitySection.style.display = 'none';
  }

  hideLoading() {
    this.loadingState.style.display = 'none';
  }

  showContent() {
    this.metricsGrid.style.display    = 'grid';
    this.chartsSection.style.display  = 'grid';
    this.activitySection.style.display= 'block';
  }

  showError(message) {
    this.errorMessage.textContent = message;
    this.errorState.style.display = 'flex';   /* .alert usa flex */
  }
}

document.addEventListener('DOMContentLoaded', () => { new DashboardPage(); });
</script>
