  <script>
    /**
     * Study List - Main Logic
     */
    (function initStudyList() {
      'use strict';

      let currentPage = 1;
      let pageSize = 20;
      let totalItems = 0;
      let allStudies = [];
      let filteredStudies = [];

      const elements = {
        loading: document.getElementById('loading-container'),
        table: document.getElementById('table-container'),
        emptyState: document.getElementById('empty-state'),
        tbody: document.getElementById('studies-tbody'),
        pagination: document.getElementById('pagination-container'),
        paginationShowing: document.getElementById('pagination-showing'),
        paginationTotal: document.getElementById('pagination-total'),
        pageNumbers: document.getElementById('page-numbers')
      };

      // Load studies
      function loadStudies() {
        showLoading();

        if (hasGoogleScriptAPI()) {
          google.script.run
            .withSuccessHandler(onStudiesLoaded)
            .withFailureHandler(onStudiesError)
            .getStudies();
        } else {
          // Development mode - mock data
          setTimeout(() => {
            onStudiesLoaded(getMockStudies());
          }, 800);
        }
      }

      // Handle studies loaded
      function onStudiesLoaded(studies) {
        hideLoading();
        allStudies = studies || [];
        filteredStudies = [...allStudies];
        totalItems = filteredStudies.length;
        renderStudies();
      }

      // Handle error
      function onStudiesError(error) {
        hideLoading();
        showEmpty();
        if (window.Canna && window.Canna.toast) {
          window.Canna.toast.error('Erro ao carregar estudos: ' + error.message);
        }
      }

      // Render studies table
      function renderStudies() {
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const pageStudies = filteredStudies.slice(start, end);

        if (pageStudies.length === 0) {
          showEmpty();
          return;
        }

        elements.tbody.innerHTML = '';
        pageStudies.forEach(study => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <p class="study-title">${escapeHtml(study.title)}</p>
              <p class="study-id">ID: ${escapeHtml(study.id)}</p>
            </td>
            <td>
              <span class="badge badge-${study.status.toLowerCase()}">${escapeHtml(study.status)}</span>
            </td>
            <td>${escapeHtml(study.type)}</td>
            <td>${escapeHtml(study.date)}</td>
            <td>
              <div class="table-actions">
                <button type="button" class="action-btn" onclick="viewStudy('${study.id}')" aria-label="Ver estudo">
                  <i data-feather="eye" class="icon icon-sm" aria-hidden="true"></i>
                </button>
                <button type="button" class="action-btn" onclick="editStudy('${study.id}')" aria-label="Editar estudo">
                  <i data-feather="edit" class="icon icon-sm" aria-hidden="true"></i>
                </button>
                <button type="button" class="action-btn" onclick="deleteStudy('${study.id}')" aria-label="Excluir estudo">
                  <i data-feather="trash-2" class="icon icon-sm icon-danger" aria-hidden="true"></i>
                </button>
              </div>
            </td>
          `;
          elements.tbody.appendChild(tr);
        });

        showTable();
        renderPagination();
      }

      // Render pagination
      function renderPagination() {
        const totalPages = Math.ceil(totalItems / pageSize);
        
        elements.paginationShowing.textContent = Math.min(totalItems, pageSize);
        elements.paginationTotal.textContent = totalItems;

        // Disable/enable buttons
        document.getElementById('btn-first').disabled = currentPage === 1;
        document.getElementById('btn-prev').disabled = currentPage === 1;
        document.getElementById('btn-next').disabled = currentPage === totalPages;
        document.getElementById('btn-last').disabled = currentPage === totalPages;

        // Render page numbers
        const maxButtons = 5;
        const half = Math.floor(maxButtons / 2);
        let startPage = Math.max(1, currentPage - half);
        let endPage = Math.min(totalPages, startPage + maxButtons - 1);

        if (endPage - startPage < maxButtons - 1) {
          startPage = Math.max(1, endPage - maxButtons + 1);
        }

        elements.pageNumbers.innerHTML = '';
        for (let i = startPage; i <= endPage; i++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'pagination-btn' + (i === currentPage ? ' active' : '');
          btn.textContent = i;
          btn.onclick = () => goToPage(i);
          btn.setAttribute('aria-label', `Página ${i}`);
          btn.setAttribute('aria-current', i === currentPage ? 'page' : 'false');
          elements.pageNumbers.appendChild(btn);
        }

        elements.pagination.hidden = false;
      }

      // Show/hide states
      function showLoading() {
        elements.loading.hidden = false;
        elements.table.hidden = true;
        elements.emptyState.hidden = true;
        elements.pagination.hidden = true;
      }

      function hideLoading() {
        elements.loading.hidden = true;
      }

      function showTable() {
        elements.table.hidden = false;
        elements.emptyState.hidden = true;
      }

      function showEmpty() {
        elements.table.hidden = true;
        elements.emptyState.hidden = false;
        elements.pagination.hidden = true;
      }

      // Pagination navigation
      window.goToPage = function(page) {
        const totalPages = Math.ceil(totalItems / pageSize);
        
        if (page === 'prev') {
          currentPage = Math.max(1, currentPage - 1);
        } else if (page === 'next') {
          currentPage = Math.min(totalPages, currentPage + 1);
        } else if (page === 'last') {
          currentPage = totalPages;
        } else {
          currentPage = page;
        }

        renderStudies();
      };

      // Apply filters
      window.applyFilters = function(event) {
        if (event) event.preventDefault();

        const search = document.getElementById('filter-search').value.toLowerCase();
        const status = document.getElementById('filter-status').value;
        const dateFrom = document.getElementById('filter-date-from').value;
        const dateTo = document.getElementById('filter-date-to').value;

        filteredStudies = allStudies.filter(study => {
          // Search filter
          if (search && !study.title.toLowerCase().includes(search) && !study.id.toLowerCase().includes(search)) {
            return false;
          }

          // Status filter
          if (status && study.status.toLowerCase() !== status) {
            return false;
          }

          // Date filters
          if (dateFrom && study.date < dateFrom) {
            return false;
          }
          if (dateTo && study.date > dateTo) {
            return false;
          }

          return true;
        });

        totalItems = filteredStudies.length;
        currentPage = 1;
        renderStudies();

        if (window.Canna && window.Canna.toast) {
          window.Canna.toast.success(`${totalItems} estudos encontrados`);
        }
      };

      // Clear filters
      window.clearFilters = function() {
        document.getElementById('filters-form').reset();
        filteredStudies = [...allStudies];
        totalItems = filteredStudies.length;
        currentPage = 1;
        renderStudies();

        if (window.Canna && window.Canna.toast) {
          window.Canna.toast.info('Filtros limpos');
        }
      };

      // Actions
      window.createStudy = function() {
        window.location.href = '#novo-estudo';
      };

      window.viewStudy = function(id) {
        window.location.href = `#estudo/${id}`;
      };

      window.editStudy = function(id) {
        window.location.href = `#estudo/${id}/editar`;
      };

      window.deleteStudy = function(id) {
        if (!confirm('Tem certeza que deseja excluir este estudo?')) return;

        if (hasGoogleScriptAPI()) {
          google.script.run
            .withSuccessHandler(() => {
              if (window.Canna && window.Canna.toast) {
                window.Canna.toast.success('Estudo excluído');
              }
              loadStudies();
            })
            .withFailureHandler((error) => {
              if (window.Canna && window.Canna.toast) {
                window.Canna.toast.error('Erro ao excluir: ' + error.message);
              }
            })
            .deleteStudy(id);
        }
      };

      window.exportStudies = function() {
        if (window.Canna && window.Canna.toast) {
          window.Canna.toast.info('Exportando estudos...');
        }
        // Implement export logic
      };

      // Utilities
      function hasGoogleScriptAPI() {
