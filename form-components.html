<script>
/**
 * Form Components JavaScript
 */
(function() {
  'use strict';
  
  /**
   * Form Validation Manager
   */
  class FormValidator {
    constructor(formElement) {
      this.form = formElement;
      this.validators = new Map();
      this.init();
    }
    
    init() {
      // Validação em tempo real
      this.form.querySelectorAll('input, textarea, select').forEach(field => {
        field.addEventListener('blur', () => this.validateField(field));
        field.addEventListener('input', () => this.clearFieldError(field));
      });
      
      // Submit handler
      this.form.addEventListener('submit', (e) => this.handleSubmit(e));
      
      // Character counters
      this.form.querySelectorAll('[maxlength]').forEach(field => {
        this.setupCharacterCounter(field);
      });
    }
    
    addValidator(fieldName, validatorFn, errorMessage) {
      if (!this.validators.has(fieldName)) {
        this.validators.set(fieldName, []);
      }
      this.validators.get(fieldName).push({ fn: validatorFn, message: errorMessage });
    }
    
    validateField(field) {
      const fieldName = field.name;
      const validators = this.validators.get(fieldName);
      
      if (!validators) return true;
      
      for (const validator of validators) {
        if (!validator.fn(field.value, field)) {
          this.showFieldError(field, validator.message);
          return false;
        }
      }
      
      this.clearFieldError(field);
      return true;
    }
    
    validateAll() {
      let isValid = true;
      const fields = this.form.querySelectorAll('input, textarea, select');
      
      fields.forEach(field => {
        if (!this.validateField(field)) {
          isValid = false;
        }
      });
      
      return isValid;
    }
    
    showFieldError(field, message) {
      const formField = field.closest('.form-field');
      if (!formField) return;
      
      formField.classList.add('has-error');
      formField.classList.remove('has-success');
      
      const errorElement = formField.querySelector('.form-field-error');
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.classList.add('show');
      }
      
      field.setAttribute('aria-invalid', 'true');
    }
    
    clearFieldError(field) {
      const formField = field.closest('.form-field');
      if (!formField) return;
      
      formField.classList.remove('has-error');
      formField.classList.add('has-success');
      
      const errorElement = formField.querySelector('.form-field-error');
      if (errorElement) {
        errorElement.classList.remove('show');
      }
      
      field.setAttribute('aria-invalid', 'false');
    }
    
    setupCharacterCounter(field) {
      const maxLength = parseInt(field.getAttribute('maxlength'));
      const formField = field.closest('.form-field');
      
      if (!formField) return;
      
      let counter = formField.querySelector('.form-field-counter');
      if (!counter) {
        counter = document.createElement('div');
        counter.className = 'form-field-counter';
        formField.appendChild(counter);
      }
      
      const updateCounter = () => {
        const length = field.value.length;
        counter.textContent = `${length} / ${maxLength}`;
        
        counter.classList.remove('warning', 'danger');
        if (length > maxLength * 0.9) {
          counter.classList.add(length >= maxLength ? 'danger' : 'warning');
        }
      };
      
      field.addEventListener('input', updateCounter);
      updateCounter();
    }
    
    handleSubmit(e) {
      e.preventDefault();
      
      if (!this.validateAll()) {
        // Scroll to first error
        const firstError = this.form.querySelector('.has-error');
        if (firstError) {
          firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return false;
      }
      
      // Form is valid, proceed with submission
      return true;
    }
    
    showLoading() {
      const overlay = this.form.querySelector('.form-loading-overlay');
      if (overlay) {
        overlay.classList.add('show');
      }
      
      // Disable all inputs
      this.form.querySelectorAll('input, textarea, select, button').forEach(el => {
        el.disabled = true;
      });
    }
    
    hideLoading() {
      const overlay = this.form.querySelector('.form-loading-overlay');
      if (overlay) {
        overlay.classList.remove('show');
      }
      
      // Enable all inputs
      this.form.querySelectorAll('input, textarea, select, button').forEach(el => {
        el.disabled = false;
      });
    }
  }
  
  /**
   * File Upload Handler
   */
  class FileUploadHandler {
    constructor(uploadArea) {
      this.uploadArea = uploadArea;
      this.input = uploadArea.querySelector('.file-upload-input');
      this.previewList = uploadArea.parentElement.querySelector('.file-preview-list');
      this.files = [];
      
      this.init();
    }
    
    init() {
      // Click to select
      this.uploadArea.addEventListener('click', () => this.input.click());
      
      // File selected
      this.input.addEventListener('change', (e) => this.handleFiles(e.target.files));
      
      // Drag and drop
      this.uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        this.uploadArea.classList.add('dragover');
      });
      
      this.uploadArea.addEventListener('dragleave', () => {
        this.uploadArea.classList.remove('dragover');
      });
      
      this.uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        this.uploadArea.classList.remove('dragover');
        this.handleFiles(e.dataTransfer.files);
      });
    }
    
    handleFiles(fileList) {
      Array.from(fileList).forEach(file => {
        this.files.push(file);
        this.addPreview(file);
      });
    }
    
    addPreview(file) {
      if (!this.previewList) return;
      
      const item = document.createElement('div');
      item.className = 'file-preview-item';
      item.innerHTML = `
        <div class="file-preview-icon">
          <span class="material-icons">insert_drive_file</span>
        </div>
        <div class="file-preview-info">
          <div class="file-preview-name">${file.name}</div>
          <div class="file-preview-size">${this.formatFileSize(file.size)}</div>
        </div>
        <button type="button" class="file-preview-remove" aria-label="Remover arquivo">
          <span class="material-icons">close</span>
        </button>
      `;
      
      // Remove handler
      item.querySelector('.file-preview-remove').addEventListener('click', () => {
        const index = this.files.indexOf(file);
        if (index > -1) {
          this.files.splice(index, 1);
        }
        item.remove();
      });
      
      this.previewList.appendChild(item);
    }
    
    formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
    
    getFiles() {
      return this.files;
    }
  }
  
  // Common validators
  window.FormValidators = {
    required: (value) => value.trim().length > 0,
    email: (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value),
    minLength: (min) => (value) => value.length >= min,
    maxLength: (max) => (value) => value.length <= max,
    pattern: (regex) => (value) => regex.test(value),
    number: (value) => !isNaN(value) && value.trim().length > 0,
    url: (value) => {
      try {
        new URL(value);
        return true;
      } catch {
        return false;
      }
    }
  };
  
  // Export classes
  window.FormValidator = FormValidator;
  window.FileUploadHandler = FileUploadHandler;
  
})();
</script>
