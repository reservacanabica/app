<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pareceres de Compatibilidade</title>
  
  <link rel="stylesheet" href="quality-components.css">
</head>
<body>
  <div class="list-container">
    <!-- Header -->
    <div class="list-header">
      <h2>Pareceres de Compatibilidade</h2>
      <button onclick="navigateTo('parecer-form')" class="btn-success">
        <span>🔬</span> Nova Análise
      </button>
    </div>
    
    <!-- Filters -->
    <div class="filters">
      <input
        type="search"
        id="searchInput"
        placeholder="Buscar..."
        style="flex: 1; min-width: 300px;"
      >
      
      <select id="filterVeredicto">
        <option value="">Todos os veredictos</option>
        <option value="COMPATIVEL">Compatível</option>
        <option value="COMPATIVEL_COM_RESSALVAS">Com Ressalvas</option>
        <option value="INCOMPATIVEL">Incompatível</option>
        <option value="REVISAO_HUMANA">Revisão Humana</option>
      </select>
      
      <button onclick="applyFilters()" class="btn-secondary">
        Filtrar
      </button>
    </div>
    
    <!-- Table -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('created_at')" style="cursor: pointer;">
              Data ↕
            </th>
            <th>
              Receita
            </th>
            <th>
              Protocolo
            </th>
            <th>
              Lotes
            </th>
            <th onclick="sortTable('veredicto')" style="cursor: pointer;">
              Veredicto ↕
            </th>
            <th style="text-align: center;">
              Ações
            </th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Populated via JS -->
        </tbody>
      </table>
    </div>
    
    <!-- Empty state -->
    <div id="emptyState" class="empty-state" hidden>
      <p>Nenhum parecer encontrado</p>
      <button onclick="navigateTo('parecer-form')" class="btn-success" style="margin-top: 1rem;">
        Realizar Primeira Análise
      </button>
    </div>
    
    <!-- Stats -->
    <div id="stats" style="margin-top: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
      <div style="padding: 1rem; background: var(--bg-secondary); border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase; margin-bottom: 0.5rem;">Total</div>
        <div style="font-size: 1.5rem; font-weight: 700;" id="totalCount">0</div>
      </div>
      
      <div style="padding: 1rem; background: #d1fae5; border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #065f46; text-transform: uppercase; margin-bottom: 0.5rem;">Compatíveis</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #065f46;" id="compativeisCount">0</div>
      </div>
      
      <div style="padding: 1rem; background: #fee2e2; border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #991b1b; text-transform: uppercase; margin-bottom: 0.5rem;">Incompatíveis</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #991b1b;" id="incompativeisCount">0</div>
      </div>
      
      <div style="padding: 1rem; background: #dbeafe; border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #1e40af; text-transform: uppercase; margin-bottom: 0.5rem;">Revisão Humana</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #1e40af;" id="revisaoCount">0</div>
      </div>
      
      <div style="padding: 1rem; background: #fef3c7; border-radius: 12px;">
        <div style="font-size: 0.75rem; color: #92400e; text-transform: uppercase; margin-bottom: 0.5rem;">Taxa Aprovação</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #92400e;" id="taxaAprovacao">--%</div>
      </div>
    </div>
  </div>
  
  <script src="quality-helpers.js"></script>
  <script src="api-client.html"></script>
  
  <script>
    // Estado
    let allPareceres = [];
    let filteredPareceres = [];
    let receitas = {};
    let protocolos = {};
    let currentSort = { field: 'created_at', direction: 'desc' };
    
    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      
      document.getElementById('searchInput').addEventListener('input', applyFilters);
    });
    
    /**
     * Carrega dados
     */
    async function loadData() {
      try {
        showLoading(true);
        
        const [pareceresData, receitasData, protocolosData] = await Promise.all([
          api.pareceres.list(),
          api.receitas.list().catch(() => []),
          api.protocolos.list().catch(() => [])
        ]);
        
        // Cache
        receitasData.forEach(r => { receitas[r.id] = r; });
        protocolosData.forEach(p => { protocolos[p.id] = p; });
        
        allPareceres = pareceresData;
        filteredPareceres = allPareceres;
        
        applyFilters();
        
      } catch (error) {
        handleApiError(error);
      } finally {
        showLoading(false);
      }
    }
    
    /**
     * Aplica filtros
     */
    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value;
      const filterVeredicto = document.getElementById('filterVeredicto').value;
      
      let result = allPareceres;
      
      // Filtro de busca (por ID ou observações)
      if (searchTerm) {
        result = result.filter(p => {
          const text = `${p.id} ${p.observacoes || ''}`.toLowerCase();
          return text.includes(searchTerm.toLowerCase());
        });
      }
      
      // Filtro de veredicto
      if (filterVeredicto) {
        result = result.filter(p => p.veredicto === filterVeredicto);
      }
      
      filteredPareceres = result;
      
      // Ordenação
      filteredPareceres = sortBy(filteredPareceres, currentSort.field, currentSort.direction);
      
      renderTable();
      updateStats();
    }
    
    /**
     * Ordena tabela
     */
    function sortTable(field) {
      if (currentSort.field === field) {
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.field = field;
        currentSort.direction = field === 'created_at' ? 'desc' : 'asc';
      }
      
      filteredPareceres = sortBy(filteredPareceres, currentSort.field, currentSort.direction);
      renderTable();
    }
    
    /**
     * Renderiza tabela
     */
    function renderTable() {
      const columns = [
        {
          key: 'created_at',
          render: (value) => formatDate(value)
        },
        {
          key: 'receita_id',
          render: (value) => {
            const receita = receitas[value];
            return receita ? 
              `<div style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${receita.nome_fase}">${receita.nome_fase}</div>` : 
              '<span style="color: #6b7280;">-</span>';
          }
        },
        {
          key: 'protocolo_id',
          render: (value) => {
            const protocolo = protocolos[value];
            return protocolo ? 
              `<div style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${protocolo.organismo_alvo}">${protocolo.organismo_alvo}</div>` : 
              '<span style="color: #6b7280;">-</span>';
          }
        },
        {
          key: 'lote_ids',
          render: (value) => {
            const count = value && Array.isArray(value) ? value.length : 0;
            return `<span style="font-family: monospace;">${count} lote(s)</span>`;
          }
        },
        {
          key: 'veredicto',
          render: (value) => getStatusBadge(value)
        }
      ];
      
      const actionsRenderer = (item) => {
        const needsReview = item.veredicto === 'REVISAO_HUMANA';
        
        return `
          <div style="display: flex; gap: 0.5rem; justify-content: center;">
            <button onclick="viewParecer('${item.id}')" class="btn-sm btn-secondary" title="Visualizar">
              👁️
            </button>
            ${needsReview ? `
              <button onclick="reviewParecer('${item.id}')" class="btn-sm btn-warning" title="Revisar">
                📝
              </button>
            ` : ''}
            <button onclick="deleteParecer('${item.id}')" class="btn-sm btn-danger" title="Excluir">
              🗑️
            </button>
          </div>
        `;
      };
      
      window.renderTable(filteredPareceres, columns, actionsRenderer);
    }
    
    /**
     * Atualiza estatísticas
     */
    function updateStats() {
      const total = filteredPareceres.length;
      
      const compativeis = filteredPareceres.filter(p => 
        p.veredicto === 'COMPATIVEL' || p.veredicto === 'COMPATIVEL_COM_RESSALVAS'
      ).length;
      
      const incompativeis = filteredPareceres.filter(p => 
        p.veredicto === 'INCOMPATIVEL'
      ).length;
      
      const revisao = filteredPareceres.filter(p => 
        p.veredicto === 'REVISAO_HUMANA'
      ).length;
      
      const taxaAprovacao = total > 0 ? (compativeis / total) * 100 : 0;
      
      document.getElementById('totalCount').textContent = total;
      document.getElementById('compativeisCount').textContent = compativeis;
      document.getElementById('incompativeisCount').textContent = incompativeis;
      document.getElementById('revisaoCount').textContent = revisao;
      document.getElementById('taxaAprovacao').textContent = formatPercent(taxaAprovacao, 0);
      
      document.getElementById('emptyState').hidden = total > 0;
    }
    
    /**
     * Visualiza parecer
     */
    function viewParecer(id) {
      navigateTo('parecer-view', { id });
    }
    
    /**
     * Revisa parecer (workflow de aprovação humana)
     */
    function reviewParecer(id) {
      navigateTo('parecer-workflow', { id });
    }
    
    /**
     * Exclui parecer
     */
    async function deleteParecer(id) {
      const confirmed = confirm(
        `Tem certeza que deseja excluir este parecer?\n\n` +
        `Esta ação não pode ser desfeita.`
      );
      
      if (!confirmed) return;
      
      try {
        showLoading(true);
        
        await api.pareceres.delete(id);
        
        showToast('success', 'Parecer excluído com sucesso!');
        
        await loadData();
        
      } catch (error) {
        handleApiError(error);
      } finally {
        showLoading(false);
      }
    }
  </script>
</body>
</html>
