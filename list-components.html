<style>
/* ==========================================
   LIST TOOLBAR
   ========================================== */

.list-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
  padding: var(--space-5);
  background: var(--surface-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  flex-wrap: wrap;
}

.list-toolbar-filters {
  display: flex;
  gap: var(--space-3);
  flex: 1;
  flex-wrap: wrap;
  align-items: center;
}

.list-toolbar-actions {
  display: flex;
  gap: var(--space-3);
}

.filter-input {
  min-width: 280px;
  position: relative;
}

.filter-input input {
  padding-left: var(--space-10);
}

.filter-input-icon {
  position: absolute;
  left: var(--space-3);
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
}

.filter-select {
  min-width: 180px;
}

.view-toggle {
  display: flex;
  background: var(--neutral-800);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: var(--space-1);
}

.view-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 36px;
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  border-radius: var(--radius-md);
  transition: all var(--transition-base);
}

.view-toggle-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.05);
}

.view-toggle-btn.active {
  background: var(--color-primary);
  color: white;
}

/* ==========================================
   DATA TABLE
   ========================================== */

.data-table-wrapper {
  background: var(--surface-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  overflow: hidden;
  margin-bottom: var(--space-6);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table thead {
  background: var(--neutral-800);
  position: sticky;
  top: 0;
  z-index: 10;
}

.data-table th {
  padding: var(--space-4) var(--space-5);
  text-align: left;
  font-size: var(--text-xs);
  font-weight: var(--font-semibold);
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

.data-table th.sortable {
  cursor: pointer;
  user-select: none;
  transition: color var(--transition-base);
}

.data-table th.sortable:hover {
  color: var(--text-primary);
}

.data-table th.sortable::after {
  content: '↕';
  margin-left: var(--space-2);
  opacity: 0.3;
  font-size: 12px;
}

.data-table th.sorted-asc::after {
  content: '↑';
  opacity: 1;
  color: var(--color-primary-light);
}

.data-table th.sorted-desc::after {
  content: '↓';
  opacity: 1;
  color: var(--color-primary-light);
}

.data-table tbody tr {
  transition: background var(--transition-base);
}

.data-table tbody tr:hover {
  background: rgba(255, 255, 255, 0.02);
}

.data-table tbody tr:not(:last-child) {
  border-bottom: 1px solid var(--border-color);
}

.data-table td {
  padding: var(--space-4) var(--space-5);
  color: var(--text-primary);
  font-size: var(--text-sm);
  vertical-align: middle;
}

.data-table td.truncate {
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Table Actions */
.table-actions {
  display: flex;
  gap: var(--space-2);
  justify-content: flex-end;
}

.table-action-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: transparent;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--transition-base);
}

.table-action-btn:hover {
  background: rgba(58, 107, 30, 0.12);
  border-color: var(--color-primary);
  color: var(--color-primary-light);
}

.table-action-btn .material-icons {
  font-size: 18px;
}

/* ==========================================
   CARD VIEW
   ========================================== */

.list-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: var(--space-5);
  margin-bottom: var(--space-6);
}

.list-card {
  background: var(--surface-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  padding: var(--space-5);
  transition: all var(--transition-base);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.list-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
  transform: scaleX(0);
  transition: transform var(--transition-base);
}

.list-card:hover::before {
  transform: scaleX(1);
}

.list-card:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

.list-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: var(--space-4);
}

.list-card-title {
  font-size: var(--text-lg);
  font-weight: var(--font-semibold);
  color: var(--text-primary);
  margin-bottom: var(--space-1);
}

.list-card-subtitle {
  font-size: var(--text-sm);
  color: var(--text-tertiary);
}

.list-card-body {
  margin-bottom: var(--space-4);
}

.list-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  font-size: var(--text-xs);
  color: var(--text-tertiary);
}

.list-card-meta-item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.list-card-meta-item .material-icons {
  font-size: 14px;
}

.list-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-color);
}

/* ==========================================
   PAGINATION
   ========================================== */

.pagination-wrapper {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-5);
  background: var(--surface-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  flex-wrap: wrap;
  gap: var(--space-4);
}

.pagination-info {
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

.pagination-info strong {
  color: var(--text-primary);
  font-weight: var(--font-semibold);
}

.pagination {
  display: flex;
  gap: var(--space-2);
}

.pagination-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  height: 36px;
  padding: 0 var(--space-3);
  background: transparent;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  cursor: pointer;
  transition: all var(--transition-base);
}

.pagination-btn:hover:not(:disabled) {
  background: rgba(58, 107, 30, 0.12);
  border-color: var(--color-primary);
  color: var(--color-primary-light);
}

.pagination-btn.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: white;
}

.pagination-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.pagination-btn .material-icons {
  font-size: 18px;
}

.page-size-selector {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  color: var(--text-secondary);
}

.page-size-selector select {
  width: auto;
  padding: var(--space-2) var(--space-3);
  height: 36px;
}

/* ==========================================
   EMPTY STATE
   ========================================== */

.list-empty-state {
  padding: var(--space-12) var(--space-6);
  text-align: center;
  background: var(--surface-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
}

.list-empty-icon {
  width: 96px;
  height: 96px;
  margin: 0 auto var(--space-5);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(107, 114, 128, 0.1);
  border-radius: var(--radius-full);
  color: var(--text-tertiary);
}

.list-empty-icon .material-icons {
  font-size: 48px;
}

.list-empty-title {
  font-size: var(--text-2xl);
  font-weight: var(--font-semibold);
  color: var(--text-primary);
  margin-bottom: var(--space-2);
}

.list-empty-description {
  color: var(--text-secondary);
  margin-bottom: var(--space-6);
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}

/* ==========================================
   LOADING STATE
   ========================================== */

.list-loading {
  padding: var(--space-12) var(--space-6);
  text-align: center;
}

.list-loading-spinner {
  width: 48px;
  height: 48px;
  margin: 0 auto var(--space-4);
  border: 4px solid rgba(58, 107, 30, 0.2);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.list-loading-text {
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

/* ==========================================
   BULK ACTIONS
   ========================================== */

.bulk-actions-bar {
  position: fixed;
  bottom: var(--space-6);
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-6);
  background: var(--neutral-800);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-2xl);
  z-index: var(--z-sticky);
  transition: transform var(--transition-base);
}

.bulk-actions-bar.show {
  transform: translateX(-50%) translateY(0);
}

.bulk-actions-info {
  color: var(--text-primary);
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
}

.bulk-actions-info strong {
  color: var(--color-primary-light);
}

.bulk-actions-btns {
  display: flex;
  gap: var(--space-2);
}

/* ==========================================
   RESPONSIVE
   ========================================== */

@media (max-width: 768px) {
  .list-toolbar {
    flex-direction: column;
    align-items: stretch;
  }
  
  .list-toolbar-filters {
    flex-direction: column;
  }
  
  .filter-input,
  .filter-select {
    width: 100%;
    min-width: 0;
  }
  
  .list-toolbar-actions {
    width: 100%;
    justify-content: space-between;
  }
  
  .data-table-wrapper {
    overflow-x: auto;
  }
  
  .data-table {
    min-width: 600px;
  }
  
  .list-cards {
    grid-template-columns: 1fr;
  }
  
  .pagination-wrapper {
    flex-direction: column;
    text-align: center;
  }
  
  .pagination {
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .bulk-actions-bar {
    flex-direction: column;
    width: calc(100% - var(--space-8));
  }
  
  .bulk-actions-btns {
    width: 100%;
  }
  
  .bulk-actions-btns .btn {
    flex: 1;
  }
}
</style>

<script>
/**
 * List Components JavaScript Utilities
 */
(function() {
  'use strict';
  
  /**
   * Classe para gerenciar listas
   */
  class ListManager {
    constructor(options) {
      this.container = options.container;
      this.dataSource = options.dataSource;
      this.pageSize = options.pageSize || 10;
      this.currentPage = 1;
      this.sortColumn = options.sortColumn || null;
      this.sortDirection = 'asc';
      this.filters = {};
      this.viewMode = options.viewMode || 'table'; // 'table' ou 'cards'
      this.selectedItems = new Set();
      
      this.init();
    }
    
    init() {
      this.setupEventListeners();
      this.loadData();
    }
    
    setupEventListeners() {
      // View toggle
      document.querySelectorAll('.view-toggle-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          this.changeView(e.target.closest('.view-toggle-btn').dataset.view);
        });
      });
      
      // Sort columns
      document.querySelectorAll('.sortable').forEach(th => {
        th.addEventListener('click', (e) => {
          this.sort(th.dataset.column);
        });
      });
      
      // Filters
      const searchInput = document.querySelector('.filter-input input');
      if (searchInput) {
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            this.setFilter('search', e.target.value);
          }, 300);
        });
      }
      
      // Page size selector
      const pageSizeSelect = document.querySelector('.page-size-selector select');
      if (pageSizeSelect) {
        pageSizeSelect.addEventListener('change', (e) => {
          this.setPageSize(parseInt(e.target.value));
        });
      }
    }
    
    async loadData() {
      this.showLoading();
      
      try {
        const data = await this.dataSource({
          page: this.currentPage,
          pageSize: this.pageSize,
          sortColumn: this.sortColumn,
          sortDirection: this.sortDirection,
          filters: this.filters
        });
        
        this.renderData(data);
      } catch (error) {
        this.showError(error);
      }
    }
    
    renderData(data) {
      if (!data || data.items.length === 0) {
        this.showEmptyState();
        return;
      }
      
      if (this.viewMode === 'table') {
        this.renderTable(data);
      } else {
        this.renderCards(data);
      }
      
      this.renderPagination(data);
    }
    
    renderTable(data) {
      // Implementar renderização de tabela
      console.log('Rendering table with data:', data);
    }
    
    renderCards(data) {
      // Implementar renderização de cards
      console.log('Rendering cards with data:', data);
    }
    
    renderPagination(data) {
      const totalPages = Math.ceil(data.total / this.pageSize);
      const paginationContainer = document.querySelector('.pagination');
      
      if (!paginationContainer) return;
      
      let html = '';
      
      // Previous button
      html += `
        <button class="pagination-btn" ${this.currentPage === 1 ? 'disabled' : ''} onclick="listManager.goToPage(${this.currentPage - 1})">
          <span class="material-icons">chevron_left</span>
        </button>
      `;
      
      // Page numbers
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
          html += `
            <button class="pagination-btn ${i === this.currentPage ? 'active' : ''}" onclick="listManager.goToPage(${i})">
              ${i}
            </button>
          `;
        } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
          html += '<span style="color: var(--text-tertiary);">...</span>';
        }
      }
      
      // Next button
      html += `
        <button class="pagination-btn" ${this.currentPage === totalPages ? 'disabled' : ''} onclick="listManager.goToPage(${this.currentPage + 1})">
          <span class="material-icons">chevron_right</span>
        </button>
      `;
      
      paginationContainer.innerHTML = html;
      
      // Update info
      const start = (this.currentPage - 1) * this.pageSize + 1;
      const end = Math.min(this.currentPage * this.pageSize, data.total);
      document.querySelector('.pagination-info').innerHTML = `
        Mostrando <strong>${start}-${end}</strong> de <strong>${data.total}</strong> registros
      `;
    }
    
    showLoading() {
      if (this.container) {
        this.container.innerHTML = `
          <div class="list-loading">
            <div class="list-loading-spinner"></div>
            <div class="list-loading-text">Carregando dados...</div>
          </div>
        `;
      }
    }
    
    showEmptyState() {
      if (this.container) {
        this.container.innerHTML = `
          <div class="list-empty-state">
            <div class="list-empty-icon">
              <span class="material-icons">inbox</span>
            </div>
            <h3 class="list-empty-title">Nenhum registro encontrado</h3>
            <p class="list-empty-description">
              Não há dados para exibir no momento. Experimente ajustar os filtros ou criar um novo registro.
            </p>
            <button class="btn btn-primary">
              <span class="material-icons">add</span>
              Criar Novo
            </button>
          </div>
        `;
      }
    }
    
    showError(error) {
      console.error('Error loading data:', error);
      // Implementar UI de erro
    }
    
    changeView(view) {
      this.viewMode = view;
      document.querySelectorAll('.view-toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      this.loadData();
    }
    
    sort(column) {
      if (this.sortColumn === column) {
        this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        this.sortColumn = column;
        this.sortDirection = 'asc';
      }
      
      // Update UI
      document.querySelectorAll('.sortable').forEach(th => {
        th.classList.remove('sorted-asc', 'sorted-desc');
        if (th.dataset.column === column) {
          th.classList.add(`sorted-${this.sortDirection}`);
        }
      });
      
      this.loadData();
    }
    
    setFilter(key, value) {
      if (value) {
        this.filters[key] = value;
      } else {
        delete this.filters[key];
      }
      
      this.currentPage = 1;
      this.loadData();
    }
    
    setPageSize(size) {
      this.pageSize = size;
      this.currentPage = 1;
      this.loadData();
    }
    
    goToPage(page) {
      this.currentPage = page;
      this.loadData();
    }
    
    toggleSelection(id) {
      if (this.selectedItems.has(id)) {
        this.selectedItems.delete(id);
      } else {
        this.selectedItems.add(id);
      }
      
      this.updateBulkActionsBar();
    }
    
    selectAll(items) {
      items.forEach(item => this.selectedItems.add(item.id));
      this.updateBulkActionsBar();
    }
    
    clearSelection() {
      this.selectedItems.clear();
      this.updateBulkActionsBar();
    }
    
    updateBulkActionsBar() {
      const bar = document.querySelector('.bulk-actions-bar');
      if (!bar) return;
      
      if (this.selectedItems.size > 0) {
        bar.classList.add('show');
        bar.querySelector('.bulk-actions-info strong').textContent = this.selectedItems.size;
      } else {
        bar.classList.remove('show');
      }
    }
  }
  
  // Exportar para uso global
  window.ListManager = ListManager;
  
})();
</script>
