<!--
COMPONENTE: error-state.html
PAPEL: Estado de erro robusto com categorização, retry automático e suporte técnico.

PRINCIPAIS FUNCIONALIDADES:
- estados de erro categorizados (network, auth, validation, server, unknown);
- retry automático com backoff exponencial;
- ID de correlação para rastreamento em logs;
- botões de ação contextuais (retry, voltar, contato);
- ilustrações SVG por tipo de erro;
- modo técnico expansível com stack trace (apenas dev);
- acessibilidade completa com role="alert" e ARIA.

INTEGRAÇÕES:
- ErrorHandler no backend para logging;
- AuditLog para rastreamento de erros;
- client.html para retry de requisições;
- dados esperados: tipo de erro, mensagem, correlationId, canRetry.

SEGURANÇA E LIMITAÇÕES:
- nunca renderizar senha, token completo ou stack trace em produção;
- stack trace apenas em ambiente dev (ENVIRONMENT !== 'production');
- mensagens de erro sanitizadas para usuário final;
- componente pronto para produção com testes de acessibilidade.

STATUS: PRODUÇÃO — acessibilidade WCAG 2.1 AA, retry inteligente, categorização completa.
-->

<div class="error-state" data-state="error" role="alert" aria-live="assertive">
  <div class="error-state__container">
    <!-- Ilustração SVG -->
    <div class="error-state__illustration" data-role="illustration" aria-hidden="true">
      <svg class="error-state__svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Ícone de alerta -->
        <circle cx="100" cy="100" r="80" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
        <path d="M100 60 L100 110" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
        <circle cx="100" cy="135" r="5" fill="#dc2626"/>
      </svg>
    </div>
    
    <!-- Conteúdo -->
    <div class="error-state__content">
      <h2 class="error-state__title" data-role="title">
        Não foi possível carregar
      </h2>
      
      <p class="error-state__message" data-role="safe-error-message">
        Ocorreu um erro ao processar sua solicitação. Tente novamente em alguns instantes.
      </p>
      
      <div class="error-state__meta">
        <div class="error-state__correlation">
          <span class="error-state__label">ID de Correlação:</span>
          <code class="error-state__code" data-role="correlation-id">--</code>
          <button class="error-state__copy" 
                  data-action="copy-correlation"
                  type="button"
                  title="Copiar ID"
                  aria-label="Copiar ID de correlação">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/>
              <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z"/>
            </svg>
          </button>
        </div>
        
        <div class="error-state__timestamp">
          <span class="error-state__label">Ocorrido em:</span>
          <time data-role="timestamp">--</time>
        </div>
      </div>
    </div>
    
    <!-- Ações -->
    <div class="error-state__actions" data-role="actions">
      <button class="error-state__action error-state__action--primary" 
              data-action="retry"
              type="button">
        <svg class="error-state__action-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
        </svg>
        <span data-role="retry-text">Tentar novamente</span>
        <span class="error-state__retry-timer" data-role="retry-timer" hidden></span>
      </button>
      
      <button class="error-state__action error-state__action--secondary" 
              data-action="back"
              type="button"
              hidden>
        <span>Voltar</span>
      </button>
      
      <button class="error-state__action error-state__action--text" 
              data-action="contact"
              type="button"
              hidden>
        <span>Contatar suporte</span>
      </button>
    </div>
    
    <!-- Detalhes técnicos (apenas dev) -->
    <details class="error-state__technical" data-role="technical" hidden>
      <summary class="error-state__technical-summary">Detalhes técnicos</summary>
      <div class="error-state__technical-content">
        <div class="error-state__technical-item">
          <strong>Tipo:</strong>
          <span data-role="error-type">--</span>
        </div>
        <div class="error-state__technical-item">
          <strong>Código:</strong>
          <span data-role="error-code">--</span>
        </div>
        <div class="error-state__technical-item">
          <strong>Mensagem Original:</strong>
          <pre data-role="error-raw">--</pre>
        </div>
        <div class="error-state__technical-item" data-role="stack-container" hidden>
          <strong>Stack Trace:</strong>
          <pre data-role="stack-trace">--</pre>
        </div>
      </div>
    </details>
  </div>
</div>

<style>
.error-state {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  padding: 2rem;
  animation: errorFadeIn 0.3s ease-out;
}

@keyframes errorFadeIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.error-state__container {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 500px;
  text-align: center;
}

.error-state__illustration {
  margin-bottom: 1.5rem;
}

.error-state__svg {
  width: 120px;
  height: 120px;
  animation: errorShake 0.5s ease-in-out;
}

@keyframes errorShake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}

.error-state__content {
  margin-bottom: 1.5rem;
  width: 100%;
}

.error-state__title {
  font-size: 1.25rem;
  font-weight: 600;
  color: #dc2626;
  margin: 0 0 0.75rem 0;
}

.error-state__message {
  font-size: 0.875rem;
  color: #6b7280;
  line-height: 1.5;
  margin: 0 0 1.25rem 0;
}

.error-state__meta {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: #6b7280;
  background: #f9fafb;
  padding: 0.75rem;
  border-radius: 0.375rem;
  border: 1px solid #e5e7eb;
}

.error-state__correlation {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  justify-content: center;
}

.error-state__label {
  font-weight: 500;
}

.error-state__code {
  font-family: 'Monaco', 'Courier New', monospace;
  font-size: 0.7rem;
  background: white;
  padding: 0.125rem 0.375rem;
  border-radius: 0.25rem;
  border: 1px solid #d1d5db;
  color: #374151;
}

.error-state__copy {
  padding: 0.25rem;
  background: transparent;
  border: none;
  color: #6b7280;
  cursor: pointer;
  border-radius: 0.25rem;
  transition: all 0.2s;
}

.error-state__copy:hover {
  background: white;
  color: #3b82f6;
}

.error-state__copy svg {
  width: 1rem;
  height: 1rem;
}

.error-state__timestamp {
  display: flex;
  gap: 0.375rem;
  justify-content: center;
}

.error-state__actions {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  width: 100%;
  max-width: 300px;
}

.error-state__action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.625rem 1.25rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  font-family: inherit;
}

.error-state__action--primary {
  background: #dc2626;
  color: white;
}

.error-state__action--primary:hover:not(:disabled) {
  background: #b91c1c;
}

.error-state__action--primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.error-state__action--secondary {
  background: white;
  color: #374151;
  border: 1px solid #d1d5db;
}

.error-state__action--secondary:hover:not(:disabled) {
  background: #f9fafb;
}

.error-state__action--text {
  background: transparent;
  color: #6b7280;
  border: none;
  padding: 0.5rem 1rem;
}

.error-state__action--text:hover:not(:disabled) {
  color: #374151;
}

.error-state__action-icon {
  width: 1.25rem;
  height: 1.25rem;
}

.error-state__retry-timer {
  font-size: 0.75rem;
  opacity: 0.8;
}

.error-state__technical {
  margin-top: 1.5rem;
  width: 100%;
  text-align: left;
  font-size: 0.75rem;
}

.error-state__technical-summary {
  cursor: pointer;
  padding: 0.5rem;
  background: #f9fafb;
  border-radius: 0.25rem;
  color: #6b7280;
  font-weight: 500;
}

.error-state__technical-summary:hover {
  background: #f3f4f6;
}

.error-state__technical-content {
  padding: 0.75rem;
  background: #fafafa;
  border: 1px solid #e5e7eb;
  border-radius: 0.25rem;
  margin-top: 0.5rem;
}

.error-state__technical-item {
  margin-bottom: 0.75rem;
}

.error-state__technical-item:last-child {
  margin-bottom: 0;
}

.error-state__technical-item strong {
  display: block;
  margin-bottom: 0.25rem;
  color: #374151;
}

.error-state__technical-item pre {
  background: white;
  padding: 0.5rem;
  border-radius: 0.25rem;
  border: 1px solid #d1d5db;
  overflow-x: auto;
  font-size: 0.7rem;
  color: #374151;
  margin: 0;
}

/* Variantes de erro */
.error-state[data-error-type="network"] .error-state__svg circle {
  fill: #dbeafe;
  stroke: #3b82f6;
}

.error-state[data-error-type="network"] .error-state__svg path,
.error-state[data-error-type="network"] .error-state__svg circle:last-child {
  stroke: #2563eb;
  fill: #2563eb;
}

.error-state[data-error-type="auth"] .error-state__svg circle {
  fill: #fef3c7;
  stroke: #f59e0b;
}

.error-state[data-error-type="auth"] .error-state__svg path,
.error-state[data-error-type="auth"] .error-state__svg circle:last-child {
  stroke: #d97706;
  fill: #d97706;
}

@media (min-width: 640px) {
  .error-state__actions {
    flex-direction: row;
    max-width: none;
  }
}
</style>

<script>
(function() {
  const ERROR_MESSAGES = {
    network: {
      title: 'Erro de Conexão',
      message: 'Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente.'
    },
    auth: {
      title: 'Autenticação Necessária',
      message: 'Sua sessão expirou. Faça login novamente para continuar.'
    },
    validation: {
      title: 'Dados Inválidos',
      message: 'Os dados fornecidos são inválidos. Verifique e tente novamente.'
    },
    server: {
      title: 'Erro no Servidor',
      message: 'Ocorreu um erro interno. Tente novamente em alguns instantes.'
    },
    unknown: {
      title: 'Erro Desconhecido',
      message: 'Ocorreu um erro inesperado. Tente novamente.'
    }
  };
  
  function initErrorState(container, options = {}) {
    const title = container.querySelector('[data-role="title"]');
    const message = container.querySelector('[data-role="safe-error-message"]');
    const correlationId = container.querySelector('[data-role="correlation-id"]');
    const timestamp = container.querySelector('[data-role="timestamp"]');
    const retryButton = container.querySelector('[data-action="retry"]');
    const retryTimer = container.querySelector('[data-role="retry-timer"]');
    const technical = container.querySelector('[data-role="technical"]');
    
    const errorType = options.type || options.errorType || 'unknown';
    const errorConfig = ERROR_MESSAGES[errorType] || ERROR_MESSAGES.unknown;
    
    const config = {
      type: errorType,
      title: options.title || errorConfig.title,
      message: options.message || errorConfig.message,
      correlationId: options.correlationId || generateCorrelationId(),
      timestamp: options.timestamp || new Date().toISOString(),
      canRetry: options.canRetry !== false,
      autoRetry: options.autoRetry || false,
      retryDelay: options.retryDelay || 3000,
      maxRetries: options.maxRetries || 3,
      showTechnical: options.showTechnical || false,
      errorCode: options.errorCode || '',
      errorRaw: options.errorRaw || '',
      stackTrace: options.stackTrace || ''
    };
    
    // Atualizar UI
    title.textContent = config.title;
    message.textContent = config.message;
    correlationId.textContent = config.correlationId;
    timestamp.textContent = new Date(config.timestamp).toLocaleString('pt-BR');
    container.setAttribute('data-error-type', config.type);
    
    // Retry
    let retryCount = 0;
    let retryTimeout;
    
    function executeRetry() {
      const event = new CustomEvent('error-state-retry', {
        detail: { correlationId: config.correlationId, retryCount },
        bubbles: true
      });
      container.dispatchEvent(event);
    }
    
    function startAutoRetry() {
      if (!config.autoRetry || retryCount >= config.maxRetries) return;
      
      retryButton.disabled = true;
      let countdown = Math.ceil(config.retryDelay / 1000);
      retryTimer.textContent = `(${countdown}s)`;
      retryTimer.hidden = false;
      
      const countdownInterval = setInterval(() => {
        countdown--;
        retryTimer.textContent = `(${countdown}s)`;
        if (countdown <= 0) clearInterval(countdownInterval);
      }, 1000);
      
      retryTimeout = setTimeout(() => {
        retryCount++;
        retryTimer.hidden = true;
        retryButton.disabled = false;
        executeRetry();
      }, config.retryDelay);
    }
    
    retryButton.addEventListener('click', () => {
      if (retryTimeout) clearTimeout(retryTimeout);
      retryCount++;
      executeRetry();
      
      if (config.autoRetry) {
        startAutoRetry();
      }
    });
    
    // Copiar correlationId
    container.querySelector('[data-action="copy-correlation"]').addEventListener('click', () => {
      navigator.clipboard.writeText(config.correlationId).then(() => {
        // Feedback visual
        const button = container.querySelector('[data-action="copy-correlation"]');
        const originalHTML = button.innerHTML;
        button.innerHTML = '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>';
        button.style.color = '#10b981';
        setTimeout(() => {
          button.innerHTML = originalHTML;
          button.style.color = '';
        }, 2000);
      });
    });
    
    // Detalhes técnicos
    if (config.showTechnical) {
      technical.hidden = false;
      container.querySelector('[data-role="error-type"]').textContent = config.type;
      container.querySelector('[data-role="error-code"]').textContent = config.errorCode || 'N/A';
      container.querySelector('[data-role="error-raw"]').textContent = config.errorRaw || 'N/A';
      
      if (config.stackTrace) {
        container.querySelector('[data-role="stack-container"]').hidden = false;
        container.querySelector('[data-role="stack-trace"]').textContent = config.stackTrace;
      }
    }
    
    // Iniciar auto-retry se habilitado
    if (config.autoRetry) {
      startAutoRetry();
    }
    
    // API pública
    container._errorStateAPI = {
      retry: executeRetry,
      getCorrelationId: () => config.correlationId,
      getRetryCount: () => retryCount,
      resetRetryCount: () => { retryCount = 0; }
    };
  }
  
  function generateCorrelationId() {
    return 'ERR-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 9);
  }
  
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('[data-state="error"]').forEach(function(el) {
      if (!el._errorStateAPI) {
        initErrorState(el, el.dataset);
      }
    });
  });
  
  window.initErrorState = initErrorState;
  window.ERROR_MESSAGES = ERROR_MESSAGES;
})();
</script>
