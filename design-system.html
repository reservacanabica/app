STATUS: PRODUÇÃO — Sistema de design completo e testado

<style>
/* ==========================================
   DESIGN TOKENS
   ========================================== */
:root {
  /* Paleta de cores - Cannabis Theme */
  --cbd-green-900: #1a3d0f;
  --cbd-green-800: #234010;
  --cbd-green-700: #2d5016;
  --cbd-green-600: #4CAF50;
  --cbd-green-500: #4a8526;
  --cbd-green-400: #5fb878;
  --cbd-green-300: #7eb356;
  --cbd-green-200: #a8d588;
  --cbd-green-100: #c8e6b4;
  --cbd-green-50: #e8f5e0;
  
  /* Cores neutras - Dark Theme */
  --neutral-950: #0a0c0e;
  --neutral-900: #14171a;
  --neutral-800: #1a1d22;
  --neutral-700: #1f2329;
  --neutral-600: #2f3540;
  --neutral-500: #4a5162;
  --neutral-400: #6b7280;
  --neutral-300: #9ca3af;
  --neutral-200: #d1d5db;
  --neutral-100: #e5e7eb;
  --neutral-50: #f9fafb;
  
  /* Cores semânticas */
  --color-primary: var(--cbd-green-600);
  --color-primary-hover: #45a049;
  --color-primary-active: #3d8b40;
  --color-primary-light: var(--cbd-green-400);
  --color-primary-dark: var(--cbd-green-800);
  
  --color-success: #10b981;
  --color-warning: #f59e0b;
  --color-danger: #ef4444;
  --color-info: #3b82f6;
  
  /* Superfícies */
  --surface-base: var(--neutral-900);
  --surface-raised: var(--neutral-700);
  --surface-overlay: var(--neutral-600);
  
  /* Texto */
  --text-primary: #f9fafb;
  --text-secondary: #d1d5db;
  --text-tertiary: #9ca3af;
  --text-disabled: #6b7280;
  --text-inverse: var(--neutral-900);
  
  /* Bordas */
  --border-color: var(--neutral-600);
  --border-light: var(--neutral-500);
  --border-strong: var(--neutral-400);
  
  /* Sombras */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
  --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  
  /* Espaçamento (baseado em 4px) */
  /* PRIMARY TOKENS - Reference css-tokens.html or CannaDesignSystem.html */
  --canna-space-0: 0;
  --canna-space-1: 0.25rem;  /* 4px */
  --canna-space-2: 0.5rem;   /* 8px */
  --canna-space-3: 0.75rem;  /* 12px */
  --canna-space-4: 1rem;     /* 16px */
  --canna-space-5: 1.25rem;  /* 20px */
  --canna-space-6: 1.5rem;   /* 24px */
  --canna-space-8: 2rem;     /* 32px */
  --canna-space-10: 2.5rem;  /* 40px */
  --canna-space-12: 3rem;    /* 48px */
  --canna-space-16: 4rem;    /* 64px */
  
  /* BACKWARD COMPATIBILITY ALIASES - Numeric naming */
  --space-1: var(--canna-space-1);
  --space-2: var(--canna-space-2);
  --space-3: var(--canna-space-3);
  --space-4: var(--canna-space-4);
  --space-5: var(--canna-space-5);
  --space-6: var(--canna-space-6);
  --space-8: var(--canna-space-8);
  --space-10: var(--canna-space-10);
  --space-12: var(--canna-space-12);
  --space-16: var(--canna-space-16);
  
  /* Raio de borda */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 1rem;      /* 16px */
  --radius-2xl: 1.5rem;   /* 24px */
  --radius-full: 9999px;
  
  /* Tipografia */
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Fira Code', 'Courier New', monospace;
  
  --text-xs: 0.75rem;    /* 12px */
  --text-sm: 0.875rem;   /* 14px */
  --text-base: 1rem;     /* 16px */
  --text-lg: 1.125rem;   /* 18px */
  --text-xl: 1.25rem;    /* 20px */
  --text-2xl: 1.5rem;    /* 24px */
  --text-3xl: 1.875rem;  /* 30px */
  --text-4xl: 2.25rem;   /* 36px */
  --text-5xl: 3rem;      /* 48px */
  
  /* Peso da fonte */
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;
  --font-extrabold: 800;
  
  /* Linha */
  --leading-tight: 1.25;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  --leading-loose: 2;
  
  /* Transições */
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms ease;
  
  /* Z-index */
  --z-base: 0;
  --z-dropdown: 1000;
  --z-sticky: 1020;
  --z-fixed: 1030;
  --z-modal-backdrop: 1040;
  --z-modal: 1050;
  --z-popover: 1060;
  --z-tooltip: 1070;
}

/* ==========================================
   BASE STYLES
   ========================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background: var(--surface-base);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ==========================================
   TYPOGRAPHY
   ========================================== */
h1, h2, h3, h4, h5, h6 {
  margin-bottom: var(--space-4);
  color: var(--text-primary);
  font-weight: var(--font-bold);
  line-height: var(--leading-tight);
  letter-spacing: -0.025em;
}

h1 { font-size: var(--text-4xl); }
h2 { font-size: var(--text-3xl); }
h3 { font-size: var(--text-2xl); }
h4 { font-size: var(--text-xl); }
h5 { font-size: var(--text-lg); }
h6 { font-size: var(--text-base); }

p {
  margin-bottom: var(--space-4);
  color: var(--text-secondary);
  line-height: var(--leading-relaxed);
}

a {
  color: var(--color-primary-light);
  text-decoration: none;
  transition: color var(--transition-fast);
}

a:hover {
  color: var(--color-primary);
  text-decoration: underline;
}

a:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

strong { font-weight: var(--font-semibold); }
em { font-style: italic; }

code {
  padding: var(--space-1) var(--space-2);
  background: var(--neutral-800);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 0.875em;
}

pre {
  padding: var(--space-4);
  background: var(--neutral-800);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  overflow-x: auto;
}

pre code {
  padding: 0;
  background: transparent;
  border: none;
}

/* ==========================================
   BUTTONS
   ========================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: var(--space-3) var(--space-5);
  background: var(--surface-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  color: var(--text-primary);
  font-size: var(--text-base);
  font-weight: var(--font-semibold);
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  transition: all var(--transition-base);
  white-space: nowrap;
}

.btn:hover {
  background: var(--surface-overlay);
  border-color: var(--border-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn:active {
  transform: translateY(0);
}

.btn:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* Button Variants */
.btn-primary {
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  border-color: transparent;
  color: white;
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--color-primary-hover), var(--color-primary-dark));
  box-shadow: var(--shadow-md);
}

.btn-success {
  background: var(--color-success);
  border-color: transparent;
  color: white;
}

.btn-danger {
  background: var(--color-danger);
  border-color: transparent;
  color: white;
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
}

.btn-ghost:hover {
  background: var(--surface-raised);
}

/* Button Sizes */
.btn-sm {
  min-height: 36px;
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-sm);
}

.btn-lg {
  min-height: 52px;
  padding: var(--space-4) var(--space-6);
  font-size: var(--text-lg);
}

.btn-icon {
  min-width: 44px;
  padding: var(--space-3);
}

/* ==========================================
   FORM ELEMENTS
   ========================================== */
.form-group {
  margin-bottom: var(--space-5);
}

label {
  display: block;
  margin-bottom: var(--space-2);
  color: var(--text-secondary);
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
}

input:not([type="checkbox"]):not([type="radio"]),
select,
textarea {
  display: block;
  width: 100%;
  padding: var(--space-3) var(--space-4);
  background: var(--neutral-800);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  color: var(--text-primary);
  font-size: var(--text-base);
  font-family: inherit;
  line-height: var(--leading-normal);
  transition: all var(--transition-base);
}

input::placeholder,
textarea::placeholder {
  color: var(--text-tertiary);
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--color-primary);
  background: rgba(58, 107, 30, 0.08);
  box-shadow: 0 0 0 3px rgba(58, 107, 30, 0.15);
}

input:disabled,
select:disabled,
textarea:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

input[aria-invalid="true"],
select[aria-invalid="true"],
textarea[aria-invalid="true"] {
  border-color: var(--color-danger);
}

textarea {
  min-height: 120px;
  resize: vertical;
}

/* Checkbox & Radio */
input[type="checkbox"],
input[type="radio"] {
  width: 18px;
  height: 18px;
  accent-color: var(--color-primary);
  cursor: pointer;
}

/* ==========================================
   CARDS
   ========================================== */
.card {
  background: var(--surface-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.card-header {
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--border-color);
}

.card-body {
  padding: var(--space-6);
}

.card-footer {
  padding: var(--space-5) var(--space-6);
  background: var(--neutral-800);
  border-top: 1px solid var(--border-color);
}

.card-title {
  margin: 0;
  font-size: var(--text-xl);
  font-weight: var(--font-semibold);
}

/* ==========================================
   TABLES
   ========================================== */
.table-responsive {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: var(--space-4);
  text-align: left;
  border-bottom: 1px solid var(--border-color);
}

th {
  background: var(--neutral-800);
  color: var(--text-secondary);
  font-size: var(--text-sm);
  font-weight: var(--font-semibold);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

tbody tr:hover {
  background: rgba(255, 255, 255, 0.02);
}

/* ==========================================
   BADGES & TAGS
   ========================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  background: var(--neutral-800);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-full);
  color: var(--text-secondary);
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  line-height: 1;
}

.badge-primary {
  background: rgba(58, 107, 30, 0.15);
  border-color: var(--color-primary);
  color: var(--color-primary-light);
}

.badge-success {
  background: rgba(16, 185, 129, 0.15);
  border-color: var(--color-success);
  color: var(--color-success);
}

.badge-danger {
  background: rgba(239, 68, 68, 0.15);
  border-color: var(--color-danger);
  color: var(--color-danger);
}

/* ==========================================
   ALERTS
   ========================================== */
.alert {
  padding: var(--space-4) var(--space-5);
  border-left: 4px solid;
  border-radius: var(--radius-md);
  margin-bottom: var(--space-4);
}

.alert-info {
  background: rgba(59, 130, 246, 0.1);
  border-color: var(--color-info);
  color: var(--color-info);
}

.alert-success {
  background: rgba(16, 185, 129, 0.1);
  border-color: var(--color-success);
  color: var(--color-success);
}

.alert-warning {
  background: rgba(245, 158, 11, 0.1);
  border-color: var(--color-warning);
  color: var(--color-warning);
}

.alert-danger {
  background: rgba(239, 68, 68, 0.1);
  border-color: var(--color-danger);
  color: var(--color-danger);
}

/* ==========================================
   MODALS
   ========================================== */
.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  z-index: var(--z-modal-backdrop);
}

.modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(90vw, 600px);
  max-height: 90vh;
  background: var(--surface-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-2xl);
  z-index: var(--z-modal);
  overflow: hidden;
}

.modal-header,
.modal-body,
.modal-footer {
  padding: var(--space-6);
}

.modal-header {
  border-bottom: 1px solid var(--border-color);
}

.modal-footer {
  border-top: 1px solid var(--border-color);
  display: flex;
  gap: var(--space-3);
  justify-content: flex-end;
}

/* ==========================================
   UTILITIES
   ========================================== */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

.text-center { text-align: center; }
.text-right { text-align: right; }

.d-none { display: none !important; }
.d-block { display: block !important; }
.d-flex { display: flex !important; }
.d-grid { display: grid !important; }

.flex-column { flex-direction: column; }
.align-items-center { align-items: center; }
.justify-content-between { justify-content: space-between; }
.justify-content-center { justify-content: center; }

.gap-2 { gap: var(--space-2); }
.gap-4 { gap: var(--space-4); }
.gap-6 { gap: var(--space-6); }

.mt-4 { margin-top: var(--space-4); }
.mb-4 { margin-bottom: var(--space-4); }
.ml-4 { margin-left: var(--space-4); }
.mr-4 { margin-right: var(--space-4); }

.p-4 { padding: var(--space-4); }
.p-6 { padding: var(--space-6); }

/* ==========================================
   RESPONSIVE
   ========================================== */
@media (max-width: 768px) {
  :root {
    --text-4xl: 2rem;
    --text-3xl: 1.75rem;
  }
  
  .btn {
    width: 100%;
  }
  
  .modal {
    width: 95vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
