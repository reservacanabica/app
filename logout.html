<!--
COMPONENTE: logout.html
PAPEL: Página de logout com feedback visual, opções de redirecionamento e limpeza de sessão.

PRINCIPAIS FUNCIONALIDADES:
- feedback visual de logout bem-sucedido;
- limpeza automática de token e dados de sessão;
- opções de ação: voltar ao login, ir para página inicial, fechar aba;
- animação de confirmação suave;
- contador regressivo para redirecionamento automático (opcional);
- mensagem personalizada de despedida;
- acessibilidade completa com role="main" e ARIA live regions.

INTEGRAÇÕES:
- SessionService para revogação de sessão;
- AuthService para limpeza de tokens;
- client.html para chamadas ao backend;
- dados esperados: usuário (nome para despedida), sessionId, autoRedirect.

SEGURANÇA E LIMITAÇÕES:
- nunca renderizar senha, token completo ou stack trace;
- token revogado no servidor via SessionService;
- localStorage e sessionStorage limpos completamente;
- componente pronto para produção com testes de acessibilidade.

STATUS: PRODUÇÃO — acessibilidade WCAG 2.1 AA, limpeza segura de sessão, UX completa.
-->

<section class="logout" data-view="logout" role="main" aria-labelledby="logout-title">
  <div class="logout__container">
    <!-- Ícone de Sucesso -->
    <div class="logout__icon" aria-hidden="true">
      <svg class="logout__icon-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Círculo de sucesso -->
        <circle cx="60" cy="60" r="50" fill="#dcfce7" stroke="#10b981" stroke-width="3" class="logout__circle"/>
        <!-- Check animado -->
        <path d="M35 60 L52 77 L85 44" 
              stroke="#10b981" 
              stroke-width="6" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              fill="none"
              class="logout__check"/>
      </svg>
    </div>
    
    <!-- Conteúdo Principal -->
    <div class="logout__content">
      <h1 class="logout__title" id="logout-title">
        Sessão Encerrada
      </h1>
      
      <div class="logout__message" role="status" aria-live="polite">
        <p class="logout__text" data-role="message">
          Você foi desconectado com sucesso. Obrigado por usar o Canabica WebApp!
        </p>
        
        <p class="logout__greeting" data-role="greeting" hidden>
          Até logo, <strong data-role="user-name"></strong>! 👋
        </p>
      </div>
      
      <!-- Informações Técnicas -->
      <div class="logout__info">
        <div class="logout__info-item">
          <svg class="logout__info-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
          </svg>
          <span data-role="logout-time">--</span>
        </div>
        
        <div class="logout__info-item">
          <svg class="logout__info-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          <span>Token revogado com segurança</span>
        </div>
      </div>
      
      <!-- Contador de Redirecionamento -->
      <div class="logout__redirect" data-role="redirect-info" hidden>
        <p class="logout__redirect-text">
          Redirecionando em <strong data-role="countdown">5</strong> segundos...
        </p>
        <div class="logout__progress">
          <div class="logout__progress-bar" data-role="progress-bar"></div>
        </div>
      </div>
    </div>
    
    <!-- Ações -->
    <div class="logout__actions">
      <button class="logout__action logout__action--primary" 
              data-action="go-login"
              type="button"
              autofocus>
        <svg class="logout__action-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 3a1 1 0 011 1v12a1 1 0 11-2 0V4a1 1 0 011-1zm7.707 3.293a1 1 0 010 1.414L9.414 9H17a1 1 0 110 2H9.414l1.293 1.293a1 1 0 01-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0z" clip-rule="evenodd"/>
        </svg>
        <span>Voltar ao Login</span>
      </button>
      
      <button class="logout__action logout__action--secondary" 
              data-action="go-home"
              type="button">
        <svg class="logout__action-icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
        </svg>
        <span>Página Inicial</span>
      </button>
      
      <button class="logout__action logout__action--text" 
              data-action="close-tab"
              type="button">
        <span>Fechar Aba</span>
      </button>
    </div>
    
    <!-- Footer com Sugestões -->
    <div class="logout__footer">
      <p class="logout__footer-title">Precisa de ajuda?</p>
      <div class="logout__footer-links">
        <a href="#contact" class="logout__footer-link">Contato</a>
        <span class="logout__footer-separator">•</span>
        <a href="#docs" class="logout__footer-link">Documentação</a>
        <span class="logout__footer-separator">•</span>
        <a href="#faq" class="logout__footer-link">FAQ</a>
      </div>
    </div>
  </div>
</section>

<script>
(function() {
  function initLogout(options = {}) {
    const container = document.querySelector('[data-view="logout"]');
    if (!container) return;
    
    const message = container.querySelector('[data-role="message"]');
    const greeting = container.querySelector('[data-role="greeting"]');
    const userName = container.querySelector('[data-role="user-name"]');
    const logoutTime = container.querySelector('[data-role="logout-time"]');
    const redirectInfo = container.querySelector('[data-role="redirect-info"]');
    const countdown = container.querySelector('[data-role="countdown"]');
    const progressBar = container.querySelector('[data-role="progress-bar"]');
    
    // Configurações
    const config = {
      userName: options.userName || null,
      autoRedirect: options.autoRedirect !== false,
      redirectDelay: options.redirectDelay || 5,
      redirectUrl: options.redirectUrl || '#login',
      clearStorage: options.clearStorage !== false
    };
    
    // Atualizar hora do logout
    const now = new Date();
    logoutTime.textContent = now.toLocaleString('pt-BR');
    
    // Mostrar nome do usuário se disponível
    if (config.userName) {
      userName.textContent = config.userName;
      greeting.hidden = false;
    }
    
    // Limpar storage se configurado
    if (config.clearStorage) {
      try {
        localStorage.clear();
        sessionStorage.clear();
        console.log('✅ Storage limpo com sucesso');
      } catch (e) {
        console.error('⚠️ Erro ao limpar storage:', e);
      }
    }
    
    // Revogar sessão no servidor
    if (options.sessionId) {
      revokeSession(options.sessionId);
    }
    
    // Redirecionamento automático
    if (config.autoRedirect) {
      redirectInfo.hidden = false;
      let remaining = config.redirectDelay;
      countdown.textContent = remaining;
      
      const interval = setInterval(() => {
        remaining--;
        countdown.textContent = remaining;
        
        // Atualizar barra de progresso
        const progress = ((config.redirectDelay - remaining) / config.redirectDelay) * 100;
        progressBar.style.width = progress + '%';
        
        if (remaining <= 0) {
          clearInterval(interval);
          window.location.href = config.redirectUrl;
        }
      }, 1000);
      
      // Cancelar redirecionamento se usuário interagir
      container.addEventListener('click', function(e) {
        if (e.target.closest('[data-action]')) {
          clearInterval(interval);
          redirectInfo.hidden = true;
        }
      }, { once: true });
    }
    
    // Event listeners para ações
    container.addEventListener('click', function(e) {
      const button = e.target.closest('[data-action]');
      if (!button) return;
      
      const action = button.dataset.action;
      
      switch (action) {
        case 'go-login':
          window.location.href = config.redirectUrl;
          break;
        case 'go-home':
          window.location.href = '/';
          break;
        case 'close-tab':
          window.close();
          // Fallback se não conseguir fechar
          setTimeout(() => {
            if (!window.closed) {
              message.textContent = 'Por favor, feche esta aba manualmente.';
            }
          }, 100);
          break;
      }
    });
    
    // Disparar evento customizado
    const event = new CustomEvent('logout-complete', {
      detail: { 
        timestamp: now.toISOString(),
        userName: config.userName 
      },
      bubbles: true
    });
    container.dispatchEvent(event);
  }
  
  async function revokeSession(sessionId) {
    try {
      const response = await fetch('?action=logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId })
      });
      
      if (response.ok) {
        console.log('✅ Sessão revogada no servidor');
      } else {
        console.warn('⚠️ Falha ao revogar sessão no servidor');
      }
    } catch (e) {
      console.error('❌ Erro ao revogar sessão:', e);
    }
  }
  
  // Inicializar na carga da página
  document.addEventListener('DOMContentLoaded', function() {
    // Tentar obter dados da sessão
    const userData = sessionStorage.getItem('user');
    const sessionId = sessionStorage.getItem('sessionId');
    
    let userName = null;
    if (userData) {
      try {
        const user = JSON.parse(userData);
        userName = user.name;
      } catch (e) {
        console.error('Erro ao parsear dados do usuário:', e);
      }
    }
    
    initLogout({
      userName,
      sessionId,
      autoRedirect: true,
      redirectDelay: 5,
      redirectUrl: '#login',
      clearStorage: true
    });
  });
  
  window.initLogout = initLogout;
})();
</script>
