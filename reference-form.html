<!--
COMPONENTE: reference-form.html
PAPEL: Formulário de cadastro de referências bibliográficas

FUNCIONALIDADES:
- Cadastro e edição de referências científicas
- Validação de DOI, PMID e URLs
- Integração com ReferenceService
- Acessibilidade WCAG 2.1 AA

STATUS: v1.0 - Implementado (Ampliação de Maturidade +0.07%)
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Referência - Reserva Canábica</title>
  <?!= include('styles') ?>
  <style>
    .reference-form-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1.5rem;
    }

    .form-section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: white;
      border-radius: var(--radius-md, 8px);
      box-shadow: var(--shadow-sm);
    }

    .form-section h3 {
      margin: 0 0 1rem 0;
      color: var(--color-text-primary, #212121);
      font-size: var(--font-size-lg, 1.125rem);
      font-weight: var(--font-weight-semibold, 600);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-row.full-width {
      grid-template-columns: 1fr;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: var(--font-weight-medium, 500);
      color: var(--color-text-primary, #212121);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--color-border, #e0e0e0);
      border-radius: var(--radius-sm, 4px);
      font-size: var(--font-size-base, 1rem);
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--color-primary, #4CAF50);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: var(--radius-md, 8px);
      font-weight: var(--font-weight-semibold, 600);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--color-primary, #4CAF50);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-dark, #1b5e20);
    }

    .btn-secondary {
      background: var(--color-bg-hover, #f5f5f5);
      color: var(--color-text-primary, #212121);
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .field-hint {
      font-size: var(--font-size-sm, 0.875rem);
      color: var(--color-text-secondary, #757575);
      margin-top: 0.25rem;
    }

    .required {
      color: var(--color-error, #f44336);
    }

    .alert {
      padding: 1rem;
      border-radius: var(--radius-md, 8px);
      margin-bottom: 1rem;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #4caf50;
    }

    .alert-error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #f44336;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="reference-form-container">
    <header>
      <h1>Nova Referência Bibliográfica</h1>
      <p>Cadastre referências científicas para estudos e evidências</p>
    </header>

    <div id="alert-container"></div>

    <form id="reference-form" aria-label="Formulário de cadastro de referência">
      <!-- Seção: Identificação -->
      <div class="form-section">
        <h3>Identificação</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="authors">
              Autores <span class="required" aria-label="obrigatório">*</span>
            </label>
            <input 
              type="text" 
              id="authors" 
              name="authors" 
              required 
              aria-required="true"
              placeholder="Silva, J.; Santos, M."
            />
            <span class="field-hint">Formato: Sobrenome, Inicial.; separado por ponto-e-vírgula</span>
          </div>

          <div class="form-group">
            <label for="year">
              Ano <span class="required" aria-label="obrigatório">*</span>
            </label>
            <input 
              type="number" 
              id="year" 
              name="year" 
              required 
              aria-required="true"
              min="1900" 
              max="2100"
              placeholder="2024"
            />
          </div>
        </div>

        <div class="form-row full-width">
          <div class="form-group">
            <label for="title">
              Título <span class="required" aria-label="obrigatório">*</span>
            </label>
            <input 
              type="text" 
              id="title" 
              name="title" 
              required 
              aria-required="true"
              placeholder="Título completo do artigo ou livro"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="journal">Journal/Publicação</label>
            <input 
              type="text" 
              id="journal" 
              name="journal"
              placeholder="Nature Medicine"
            />
          </div>

          <div class="form-group">
            <label for="volume">Volume/Edição</label>
            <input 
              type="text" 
              id="volume" 
              name="volume"
              placeholder="Vol. 28, n. 3"
            />
          </div>
        </div>
      </div>

      <!-- Seção: Identificadores -->
      <div class="form-section">
        <h3>Identificadores</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="doi">DOI</label>
            <input 
              type="text" 
              id="doi" 
              name="doi"
              placeholder="10.1234/journal.2024.001"
              aria-describedby="doi-hint"
            />
            <span id="doi-hint" class="field-hint">Digital Object Identifier</span>
          </div>

          <div class="form-group">
            <label for="pmid">PMID</label>
            <input 
              type="text" 
              id="pmid" 
              name="pmid"
              placeholder="12345678"
              aria-describedby="pmid-hint"
            />
            <span id="pmid-hint" class="field-hint">PubMed ID</span>
          </div>
        </div>

        <div class="form-row full-width">
          <div class="form-group">
            <label for="url">URL</label>
            <input 
              type="url" 
              id="url" 
              name="url"
              placeholder="https://..."
            />
          </div>
        </div>
      </div>

      <!-- Seção: Detalhes -->
      <div class="form-section">
        <h3>Detalhes</h3>
        
        <div class="form-row full-width">
          <div class="form-group">
            <label for="abstract">Resumo/Abstract</label>
            <textarea 
              id="abstract" 
              name="abstract"
              placeholder="Resumo do artigo..."
              rows="4"
            ></textarea>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="studyType">Tipo de Estudo</label>
            <select id="studyType" name="studyType">
              <option value="">Selecione...</option>
              <option value="RCT">Ensaio Clínico Randomizado (RCT)</option>
              <option value="META_ANALYSIS">Meta-análise</option>
              <option value="REVIEW">Revisão Sistemática</option>
              <option value="COHORT">Estudo de Coorte</option>
              <option value="CASE_CONTROL">Caso-Controle</option>
              <option value="OBSERVATIONAL">Observacional</option>
              <option value="IN_VITRO">In Vitro</option>
              <option value="ANIMAL">Estudo Animal</option>
            </select>
          </div>

          <div class="form-group">
            <label for="evidenceLevel">Nível de Evidência</label>
            <select id="evidenceLevel" name="evidenceLevel">
              <option value="">Selecione...</option>
              <option value="1A">1A - Meta-análise de RCTs</option>
              <option value="1B">1B - RCT individual</option>
              <option value="2A">2A - Revisão sistemática de coortes</option>
              <option value="2B">2B - Coorte individual</option>
              <option value="3A">3A - Revisão de caso-controle</option>
              <option value="3B">3B - Caso-controle individual</option>
              <option value="4">4 - Série de casos</option>
              <option value="5">5 - Opinião de especialista</option>
            </select>
          </div>
        </div>

        <div class="form-row full-width">
          <div class="form-group">
            <label for="notes">Notas</label>
            <textarea 
              id="notes" 
              name="notes"
              placeholder="Observações adicionais..."
              rows="3"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Ações -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" id="submit-btn">
          Salvar Referência
        </button>
      </div>
    </form>
  </div>

  <script>
    (function() {
      'use strict';

      const form = document.getElementById('reference-form');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', function(e) {
        e.preventDefault();

        if (!validateForm()) {
          return;
        }

        const formData = getFormData();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Salvando...';

        // Chamada ao backend via google.script.run
        google.script.run
          .withSuccessHandler(handleSuccess)
          .withFailureHandler(handleError)
          .apiCall({
            action: 'references.create',
            token: sessionStorage.getItem('authToken') || '',
            ...formData
          });
      });

      function getFormData() {
        return {
          authors: document.getElementById('authors').value.trim(),
          year: parseInt(document.getElementById('year').value),
          title: document.getElementById('title').value.trim(),
          journal: document.getElementById('journal').value.trim(),
          volume: document.getElementById('volume').value.trim(),
          doi: document.getElementById('doi').value.trim(),
          pmid: document.getElementById('pmid').value.trim(),
          url: document.getElementById('url').value.trim(),
          abstract: document.getElementById('abstract').value.trim(),
          studyType: document.getElementById('studyType').value,
          evidenceLevel: document.getElementById('evidenceLevel').value,
          notes: document.getElementById('notes').value.trim()
        };
      }

      function validateForm() {
        const authors = document.getElementById('authors').value.trim();
        const year = document.getElementById('year').value;
        const title = document.getElementById('title').value.trim();

        if (!authors || !year || !title) {
          showAlert('Por favor, preencha todos os campos obrigatórios.', 'error');
          return false;
        }

        const yearNum = parseInt(year);
        if (yearNum < 1900 || yearNum > 2100) {
          showAlert('Ano deve estar entre 1900 e 2100.', 'error');
          return false;
        }

        return true;
      }

      function handleSuccess(response) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Salvar Referência';

        if (response && response.ok) {
          showAlert('Referência cadastrada com sucesso!', 'success');
          form.reset();
          
          setTimeout(function() {
            window.history.back();
          }, 1500);
        } else {
          const message = (response && response.error && response.error.message) || 'Erro desconhecido';
          showAlert('Erro ao salvar: ' + message, 'error');
        }
      }

      function handleError(error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Salvar Referência';
        
        const message = (error && error.message) || 'Erro ao conectar com o servidor';
        showAlert('Erro: ' + message, 'error');
        console.error('[ReferenceForm] Error:', error);
      }

      function showAlert(message, type) {
        const container = document.getElementById('alert-container');
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        
        container.innerHTML = '<div class="alert ' + alertClass + '" role="alert">' + 
          escapeHtml(message) + '</div>';

        if (type === 'success') {
          setTimeout(function() {
            container.innerHTML = '';
          }, 5000);
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
