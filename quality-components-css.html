<style>
/**
 * @file quality-components-css.html
 * @description Estilos para componentes do domínio de qualidade de insumos
 * Layout, forms, tables, cards, tabs, badges, workflows, dashboards
 * FORMATO: HTML envelopado com <style> para compatibilidade Google Apps Script
 */

/* ============================================================================
   VARIABLES
   ========================================================================= */

:root {
  /* Colors */
  --color-primary: #2563eb;
  --color-secondary: #64748b;
  --color-success: #10b981;
  --color-warning: #f59e0b;
  --color-danger: #ef4444;
  --color-info: #3b82f6;
  
  /* Backgrounds */
  --bg-primary: #ffffff;
  --bg-secondary: #f8fafc;
  --bg-card: #ffffff;
  --bg-hover: #f1f5f9;
  
  /* Borders */
  --border-color: #e2e8f0;
  --border-radius: 12px;
  
  /* Spacing */
  --spacing-xs: 0.25rem;
  --spacing-sm: 0.5rem;
  --spacing-md: 1rem;
  --spacing-lg: 1.5rem;
  --spacing-xl: 2rem;
  
  /* Typography */
  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  
  /* Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
}

/* ============================================================================
   LAYOUT CONTAINERS
   ========================================================================= */

.form-container,
.list-container,
.view-container,
.workflow-container,
.dashboard-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--spacing-xl);
  background: var(--bg-primary);
}

/* ============================================================================
   FORMS
   ========================================================================= */

fieldset {
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  padding: var(--spacing-lg);
  margin-bottom: var(--spacing-lg);
  background: var(--bg-primary);
}

legend {
  font-weight: 600;
  font-size: var(--font-size-lg);
  padding: 0 var(--spacing-sm);
  color: var(--color-primary);
}

.form-group {
  margin-bottom: var(--spacing-md);
}

.form-group label {
  display: block;
  font-weight: 500;
  margin-bottom: var(--spacing-xs);
  color: #374151;
}

.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="email"],
.form-group input[type="date"],
.form-group input[type="url"],
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.625rem;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: var(--font-size-base);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.form-group input:disabled,
.form-group select:disabled,
.form-group textarea:disabled {
  background-color: var(--bg-secondary);
  cursor: not-allowed;
}

.form-group textarea {
  resize: vertical;
  min-height: 100px;
}

.form-group .help-text {
  font-size: var(--font-size-sm);
  color: var(--color-secondary);
  margin-top: var(--spacing-xs);
}

.form-group .error-text {
  font-size: var(--font-size-sm);
  color: var(--color-danger);
  margin-top: var(--spacing-xs);
}

.form-actions {
  display: flex;
  gap: var(--spacing-md);
  justify-content: flex-end;
  margin-top: var(--spacing-xl);
  padding-top: var(--spacing-lg);
  border-top: 1px solid var(--border-color);
}

.radio-group,
.checkbox-group {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
}

.radio-group label,
.checkbox-group label {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  font-weight: normal;
  cursor: pointer;
}

.radio-group input[type="radio"],
.checkbox-group input[type="checkbox"] {
  width: auto;
  cursor: pointer;
}

/* ============================================================================
   BUTTONS
   ========================================================================= */

.btn,
button[type="submit"],
button[type="button"] {
  padding: 0.625rem 1.25rem;
  font-size: var(--font-size-base);
  font-weight: 500;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-xs);
}

.btn-primary {
  background: var(--color-primary);
  color: white;
}

.btn-primary:hover {
  background: #1d4ed8;
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  background: var(--color-secondary);
  color: white;
}

.btn-secondary:hover {
  background: #475569;
}

.btn-success {
  background: var(--color-success);
  color: white;
}

.btn-success:hover {
  background: #059669;
}

.btn-warning {
  background: var(--color-warning);
  color: white;
}

.btn-warning:hover {
  background: #d97706;
}

.btn-danger {
  background: var(--color-danger);
  color: white;
}

.btn-danger:hover {
  background: #dc2626;
}

.btn-sm {
  padding: 0.375rem 0.75rem;
  font-size: var(--font-size-sm);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ============================================================================
   TABLES
   ========================================================================= */

.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-lg);
}

.list-header h2 {
  margin: 0;
  font-size: var(--font-size-2xl);
}

.filters {
  display: flex;
  gap: var(--spacing-md);
  margin-bottom: var(--spacing-lg);
  padding: var(--spacing-md);
  background: var(--bg-secondary);
  border-radius: var(--border-radius);
}

.filters input[type="search"],
.filters select {
  padding: 0.5rem;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: var(--font-size-base);
}

.filters input[type="search"] {
  flex: 1;
  min-width: 250px;
}

.table-responsive {
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
  border-radius: var(--border-radius);
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-primary);
}

thead {
  background: var(--bg-secondary);
}

th {
  padding: 0.75rem;
  text-align: left;
  font-weight: 600;
  font-size: var(--font-size-sm);
  color: #374151;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 2px solid var(--border-color);
}

td {
  padding: 0.75rem;
  border-bottom: 1px solid var(--border-color);
  color: #1f2937;
}

tbody tr:hover {
  background: var(--bg-hover);
}

tbody tr:last-child td {
  border-bottom: none;
}

.empty-state {
  text-align: center;
  padding: var(--spacing-xl);
  color: var(--color-secondary);
}

.empty-state p {
  font-size: var(--font-size-lg);
  margin: 0;
}

/* ============================================================================
   CARDS
   ========================================================================= */

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  padding: var(--spacing-lg);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s;
}

.card:hover {
  box-shadow: var(--shadow-md);
}

.card h3 {
  margin: 0 0 var(--spacing-sm) 0;
  font-size: var(--font-size-base);
  font-weight: 600;
  color: #6b7280;
}

.card-value {
  font-size: 2.5rem;
  font-weight: 700;
  color: #111827;
  margin-top: var(--spacing-sm);
}

.card-success {
  border-left: 4px solid var(--color-success);
}

.card-warning {
  border-left: 4px solid var(--color-warning);
}

.card-danger {
  border-left: 4px solid var(--color-danger);
}

.card-info {
  border-left: 4px solid var(--color-info);
}

/* ============================================================================
   TABS
   ========================================================================= */

.tabs {
  display: flex;
  gap: var(--spacing-sm);
  border-bottom: 2px solid var(--border-color);
  margin-bottom: var(--spacing-lg);
}

.tab {
  padding: 0.75rem 1.5rem;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-size: var(--font-size-base);
  font-weight: 500;
  color: #6b7280;
  transition: all 0.2s;
  position: relative;
  top: 2px;
}

.tab:hover {
  color: var(--color-primary);
}

.tab.active {
  border-bottom-color: var(--color-primary);
  color: var(--color-primary);
  font-weight: 600;
}

.tab-content {
  display: none;
  animation: fadeIn 0.3s;
}

.tab-content.active {
  display: block;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ============================================================================
   BADGES
   ========================================================================= */

.badge {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  font-size: var(--font-size-sm);
  font-weight: 500;
  border-radius: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.badge-success {
  background: #d1fae5;
  color: #065f46;
}

.badge-warning {
  background: #fef3c7;
  color: #92400e;
}

.badge-danger {
  background: #fee2e2;
  color: #991b1b;
}

.badge-info {
  background: #dbeafe;
  color: #1e40af;
}

.badge-secondary {
  background: #e2e8f0;
  color: #475569;
}

/* ============================================================================
   VIEW
   ========================================================================= */

.view-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-xl);
  padding-bottom: var(--spacing-lg);
  border-bottom: 1px solid var(--border-color);
}

.view-header h2 {
  margin: 0;
  font-size: var(--font-size-2xl);
}

.view-header .actions {
  display: flex;
  gap: var(--spacing-sm);
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
}

.info-item {
  padding: var(--spacing-md);
  background: var(--bg-secondary);
  border-radius: var(--border-radius);
}

.info-item label {
  display: block;
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: #6b7280;
  margin-bottom: var(--spacing-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.info-item .value {
  font-size: var(--font-size-lg);
  color: #111827;
}

/* ============================================================================
   WORKFLOW
   ========================================================================= */

.workflow-content {
  max-width: 800px;
  margin: 0 auto;
}

.entity-summary {
  padding: var(--spacing-lg);
  background: var(--bg-secondary);
  border-radius: var(--border-radius);
  margin-bottom: var(--spacing-xl);
}

.entity-summary h3 {
  margin-top: 0;
  font-size: var(--font-size-lg);
  color: var(--color-primary);
}

/* ============================================================================
   DASHBOARD
   ========================================================================= */

.alerts-section {
  margin-top: var(--spacing-xl);
}

.alerts-section h3 {
  font-size: var(--font-size-xl);
  margin-bottom: var(--spacing-md);
}

.alert-item {
  padding: var(--spacing-md);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--color-warning);
  border-radius: var(--border-radius);
  margin-bottom: var(--spacing-sm);
}

.alert-item.alert-danger {
  border-left-color: var(--color-danger);
}

.alert-item.alert-info {
  border-left-color: var(--color-info);
}

.alert-item .alert-title {
  font-weight: 600;
  margin-bottom: var(--spacing-xs);
}

.alert-item .alert-message {
  font-size: var(--font-size-sm);
  color: #6b7280;
}

/* ============================================================================
   UTILITIES
   ========================================================================= */

.text-center {
  text-align: center;
}

.text-right {
  text-align: right;
}

.mt-0 { margin-top: 0; }
.mt-1 { margin-top: var(--spacing-xs); }
.mt-2 { margin-top: var(--spacing-sm); }
.mt-3 { margin-top: var(--spacing-md); }
.mt-4 { margin-top: var(--spacing-lg); }

.mb-0 { margin-bottom: 0; }
.mb-1 { margin-bottom: var(--spacing-xs); }
.mb-2 { margin-bottom: var(--spacing-sm); }
.mb-3 { margin-bottom: var(--spacing-md); }
.mb-4 { margin-bottom: var(--spacing-lg); }

.hidden {
  display: none !important;
}

.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: var(--spacing-xl);
}

.spinner {
  border: 3px solid var(--border-color);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================================================
   RESPONSIVE
   ========================================================================= */

@media (max-width: 768px) {
  .form-container,
  .list-container,
  .view-container,
  .workflow-container,
  .dashboard-container {
    padding: var(--spacing-md);
  }
  
  .cards-grid {
    grid-template-columns: 1fr;
  }
  
  .filters {
    flex-direction: column;
  }
  
  .filters input[type="search"] {
    min-width: 100%;
  }
  
  .list-header {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--spacing-md);
  }
  
  .view-header {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--spacing-md);
  }
  
  .form-actions {
    flex-direction: column;
  }
  
  .form-actions button {
    width: 100%;
  }
}
</style>
