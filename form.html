<!--
COMPONENTE: form.html
PAPEL: Formulário genérico.

PRINCIPAIS FUNCIONALIDADES:
- serialização, validação visual, cancelamento e envio;
- mantém o estado de UI separado do processamento no Apps Script;
- não acessa diretamente a planilha: usa client.html e os contratos do Web App.

INTEGRAÇÕES:
- ValidationService via API;
- dados esperados: Payload CRUD.

SEGURANÇA E LIMITAÇÕES:
- nunca renderizar senha, token completo ou stack trace;
- validação visual não substitui ValidationService no servidor;
- usar escaping/templating seguro para texto proveniente da planilha;
- esqueleto preparado para HtmlService e componentes parciais.

STATUS: ESQUELETO DE INTERFACE — completar acessibilidade, testes e estados de erro.
-->
<form 
  data-role="entity-form" 
  novalidate 
  aria-label="Formulário de dados">
  
  <fieldset>
    <legend class="sr-only">Campos do formulário</legend>
    <div data-role="fields" role="group">
      <!-- Campos inseridos dinamicamente -->
    </div>
  </fieldset>
  
  <div class="form-actions" role="group" aria-label="Ações do formulário">
    <button 
      type="submit" 
      class="btn-primary"
      aria-label="Salvar alterações">
      💾 Salvar
    </button>
    
    <button 
      type="button" 
      data-action="cancel"
      class="btn-secondary"
      aria-label="Cancelar e voltar">
      ✖️ Cancelar
    </button>
  </div>
  
  <div 
    data-role="form-error" 
    role="alert" 
    aria-live="assertive" 
    aria-atomic="true"
    class="form-error-message">
    <!-- Mensagens de erro inseridas dinamicamente -->
  </div>
</form>
