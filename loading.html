<!--
COMPONENTE: loading.html
PAPEL: Estados de carregamento avançados com feedback visual.

PRINCIPAIS FUNCIONALIDADES:
- múltiplos tipos de loading (spinner, skeleton, progress bar);
- mensagens contextuais e animações suaves;
- estimativa de tempo e feedback progressivo;
- acessibilidade com aria-live e screen readers.

INTEGRAÇÕES:
- client.html, todas as operações assíncronas;
- dados esperados: tipo de loading, mensagem opcional, progresso.

SEGURANÇA E LIMITAÇÕES:
- nunca renderizar senha, token completo ou stack trace;
- validação visual não substitui ValidationService no servidor;
- usar escaping/templating seguro para texto proveniente da planilha.

STATUS: COMPONENTE COMPLETO — pronto para produção com múltiplas variantes.
-->

<!-- Loading Overlay Principal -->
<div data-role="loading" class="loading-overlay hidden" role="status" aria-live="polite" aria-label="Carregando">
  <div class="loading-container">
    <!-- Spinner animado -->
    <div class="loading-spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
    </div>
    
    <!-- Mensagem de loading -->
    <div class="loading-message">
      <span data-role="loading-text">Processando…</span>
      <span class="loading-dots">
        <span>.</span><span>.</span><span>.</span>
      </span>
    </div>
    
    <!-- Barra de progresso (opcional) -->
    <div data-role="loading-progress" class="loading-progress hidden">
      <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill" style="width: 0%"></div>
      </div>
      <span class="progress-text">0%</span>
    </div>
    
    <!-- Dica opcional -->
    <small data-role="loading-tip" class="loading-tip hidden"></small>
  </div>
</div>

<!-- Loading Inline (para usar dentro de containers) -->
<div data-role="loading-inline" class="loading-inline hidden">
  <div class="spinner-small"></div>
  <span data-role="inline-text">Carregando...</span>
</div>

<!-- Skeleton Loader (para listas) -->
<div data-role="loading-skeleton" class="loading-skeleton hidden">
  <div class="skeleton-item">
    <div class="skeleton-avatar"></div>
    <div class="skeleton-content">
      <div class="skeleton-line skeleton-line-title"></div>
      <div class="skeleton-line skeleton-line-text"></div>
      <div class="skeleton-line skeleton-line-text short"></div>
    </div>
  </div>
  <div class="skeleton-item">
    <div class="skeleton-avatar"></div>
    <div class="skeleton-content">
      <div class="skeleton-line skeleton-line-title"></div>
      <div class="skeleton-line skeleton-line-text"></div>
      <div class="skeleton-line skeleton-line-text short"></div>
    </div>
  </div>
  <div class="skeleton-item">
    <div class="skeleton-avatar"></div>
    <div class="skeleton-content">
      <div class="skeleton-line skeleton-line-title"></div>
      <div class="skeleton-line skeleton-line-text"></div>
      <div class="skeleton-line skeleton-line-text short"></div>
    </div>
  </div>
</div>

<style>
/* Loading Overlay */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: fadeIn 0.2s ease;
}

.loading-container {
  background: white;
  padding: var(--canna-space-10); /* 40px */
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  text-align: center;
  min-width: 300px;
  animation: scaleIn 0.3s ease;
}

/* Spinner Animado */
.loading-spinner {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
}

.spinner-ring {
  position: absolute;
  width: 100%;
  height: 100%;
  border: 4px solid transparent;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
}

.spinner-ring:nth-child(2) {
  border-top-color: #764ba2;
  animation-delay: -0.4s;
}

.spinner-ring:nth-child(3) {
  border-top-color: #f093fb;
  animation-delay: -0.8s;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Mensagem */
.loading-message {
  font-size: 18px;
  font-weight: 600;
  color: #2c3e50;
  margin-bottom: 10px;
}

.loading-dots span {
  animation: blink 1.4s infinite;
}

.loading-dots span:nth-child(2) {
  animation-delay: 0.2s;
}

.loading-dots span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes blink {
  0%, 60%, 100% { opacity: 0; }
  30% { opacity: 1; }
}

/* Progress Bar */
.loading-progress {
  margin-top: 20px;
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: #ecf0f1;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
  transition: width 0.3s ease;
  animation: progress-shimmer 2s infinite;
}

@keyframes progress-shimmer {
  0% { background-position: -200px 0; }
  100% { background-position: 200px 0; }
}

.progress-text {
  font-size: 14px;
  color: #7f8c8d;
  font-weight: 600;
}

.loading-tip {
  display: block;
  margin-top: 15px;
  color: #95a5a6;
  font-size: 13px;
  font-style: italic;
}

/* Loading Inline */
.loading-inline {
  display: inline-flex;
  align-items: center;
  gap: var(--canna-space-2); /* 8px */
  padding: var(--canna-space-2) var(--canna-space-4); /* 8px 16px */
  color: #667eea;
  font-size: 14px;
}

.spinner-small {
  width: 16px;
  height: 16px;
  border: 2px solid #ecf0f1;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* Skeleton Loader */
.loading-skeleton {
  padding: var(--canna-space-5); /* 20px */
}

.skeleton-item {
  display: flex;
  gap: var(--canna-space-4); /* 16px */
  padding: var(--canna-space-4); /* 16px */
  background: white;
  border: 1px solid #ecf0f1;
  border-radius: 12px;
  margin-bottom: 12px;
}

.skeleton-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(90deg, #ecf0f1 25%, #f8f9fa 50%, #ecf0f1 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

.skeleton-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--canna-space-2); /* 8px */
}

.skeleton-line {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(90deg, #ecf0f1 25%, #f8f9fa 50%, #ecf0f1 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

.skeleton-line-title {
  height: 16px;
  width: 60%;
}

.skeleton-line-text {
  width: 100%;
}

.skeleton-line-text.short {
  width: 40%;
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scaleIn {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Estados */
.hidden {
  display: none !important;
}
</style>

<script>
(function() {
  // API de Loading
  window.Loading = {
    // Mostrar loading com overlay
    show: function(message, options) {
      const opts = options || {};
      const overlay = document.querySelector('[data-role="loading"]');
      const textEl = overlay.querySelector('[data-role="loading-text"]');
      const tipEl = overlay.querySelector('[data-role="loading-tip"]');
      const progressContainer = overlay.querySelector('[data-role="loading-progress"]');
      
      if (textEl) textEl.textContent = message || 'Processando…';
      
      if (opts.tip) {
        tipEl.textContent = opts.tip;
        tipEl.classList.remove('hidden');
      } else {
        tipEl.classList.add('hidden');
      }
      
      if (opts.showProgress) {
        progressContainer.classList.remove('hidden');
        this.setProgress(0);
      } else {
        progressContainer.classList.add('hidden');
      }
      
      overlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    },
    
    // Esconder loading
    hide: function() {
      const overlay = document.querySelector('[data-role="loading"]');
      overlay.classList.add('hidden');
      document.body.style.overflow = '';
    },
    
    // Atualizar progresso (0-100)
    setProgress: function(percent) {
      const progressBar = document.querySelector('.progress-fill');
      const progressText = document.querySelector('.progress-text');
      const progressContainer = document.querySelector('[data-role="loading-progress"]');
      
      if (progressBar && progressContainer && !progressContainer.classList.contains('hidden')) {
        const value = Math.min(100, Math.max(0, percent));
        progressBar.style.width = value + '%';
        progressBar.parentElement.setAttribute('aria-valuenow', value);
        if (progressText) progressText.textContent = Math.round(value) + '%';
      }
    },
    
    // Mostrar skeleton loader
    showSkeleton: function(container) {
      const skeleton = document.querySelector('[data-role="loading-skeleton"]').cloneNode(true);
      skeleton.classList.remove('hidden');
      if (container) {
        container.innerHTML = '';
        container.appendChild(skeleton);
      }
      return skeleton;
    },
    
    // Mostrar loading inline
    showInline: function(container, message) {
      const inline = document.querySelector('[data-role="loading-inline"]').cloneNode(true);
      const textEl = inline.querySelector('[data-role="inline-text"]');
      if (textEl && message) textEl.textContent = message;
      inline.classList.remove('hidden');
      if (container) {
        container.innerHTML = '';
        container.appendChild(inline);
      }
      return inline;
    }
  };
})();
</script>
